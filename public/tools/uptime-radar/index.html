<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uptime Radar</title>
<style>
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --accent: #ff6b35;
  --text: #e0e0e0;
  --green: #2ecc71;
  --red: #e74c3c;
  --orange: #f39c12;
  --gray: #555;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,.4);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:'Courier New',Courier,monospace;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px;
}
.app {
  width:100%;
  max-width:960px;
}
/* -------- header -------- */
.header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 0;
  border-bottom:2px solid var(--surface);
  margin-bottom:24px;
}
.header h1 {
  font-size:1.5rem;
  letter-spacing:2px;
}
.header h1 span { color:var(--accent); }
.header-left { display:flex; align-items:center; gap:14px; }
.proxy-input { display:flex; align-items:center; gap:6px; margin-top:6px; }
.proxy-input label { font-size:.7rem; color:var(--gray); white-space:nowrap; }
.proxy-input input { background:var(--surface); border:1px solid #333; border-radius:6px; padding:4px 8px; color:var(--text); font-family:inherit; font-size:.75rem; flex:1; min-width:120px; outline:none; transition:border .2s; }
.proxy-input input:focus { border-color:var(--accent); }
.proxy-input input::placeholder { color:#555; }
.radar-icon {
  font-size:1.8rem;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.6;transform:scale(1.12)}
}
.last-updated {
  font-size:.75rem;
  color:var(--gray);
  text-align:right;
  margin-top:4px;
}
/* -------- summary cards -------- */
.summary {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:12px;
  margin-bottom:24px;
}
.card {
  background:var(--surface);
  border-radius:var(--radius);
  padding:16px;
  text-align:center;
  box-shadow:var(--shadow);
  transition:transform .15s;
}
.card:hover { transform:translateY(-2px); }
.card .label {
  font-size:.7rem;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--gray);
  margin-bottom:6px;
}
.card .value {
  font-size:1.6rem;
  font-weight:700;
}
.card.accent .value { color:var(--accent); }
.card.green .value { color:var(--green); }
.card.red .value { color:var(--red); }
.card.orange .value { color:var(--orange); }
.card.pct .value { font-size:1.3rem; }
/* -------- add form -------- */
.add-row {
  display:flex;
  gap:8px;
  margin-bottom:20px;
}
.add-row input {
  flex:1;
  background:var(--surface);
  border:1px solid #333;
  border-radius:var(--radius);
  padding:12px 16px;
  color:var(--text);
  font-family:inherit;
  font-size:.9rem;
  outline:none;
  transition:border .2s;
}
.add-row input:focus { border-color:var(--accent); }
.add-row input::placeholder { color:#555; }
.add-row button {
  background:var(--accent);
  border:none;
  border-radius:var(--radius);
  padding:12px 20px;
  color:#fff;
  font-family:inherit;
  font-weight:700;
  font-size:.85rem;
  cursor:pointer;
  transition:opacity .2s,transform .15s;
  white-space:nowrap;
}
.add-row button:hover { opacity:.85; transform:scale(1.03); }
/* -------- endpoint list -------- */
.endpoints { display:flex; flex-direction:column; gap:12px; }
.endpoint {
  background:var(--surface);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.endpoint-top {
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.status-dot {
  width:14px;
  height:14px;
  border-radius:50%;
  flex-shrink:0;
  transition:background .3s;
}
.status-dot.up { background:var(--green); box-shadow:0 0 8px var(--green); }
.status-dot.down { background:var(--red); box-shadow:0 0 8px var(--red); }
.status-dot.checking { background:var(--orange); box-shadow:0 0 8px var(--orange); }
.endpoint-url {
  flex:1;
  font-size:.95rem;
  word-break:break-all;
  min-width:0;
}
.endpoint-stats {
  display:flex;
  gap:16px;
  font-size:.78rem;
  color:var(--gray);
  margin-top:6px;
  margin-left:26px;
}
.endpoint-stats .latency {
  color:var(--text);
  font-weight:700;
}
.endpoint-stats .uptime-pct { color:var(--green); }
.btn-remove {
  background:transparent;
  border:1px solid #444;
  border-radius:8px;
  color:var(--gray);
  cursor:pointer;
  font-size:.8rem;
  padding:4px 10px;
  transition:all .2s;
  font-family:inherit;
}
.btn-remove:hover {
  border-color:var(--red);
  color:var(--red);
  background:rgba(231,76,60,.1);
}
/* -------- sparkline -------- */
.sparkline-wrap {
  margin-top:10px;
  margin-left:26px;
  height:36px;
  position:relative;
}
.sparkline-wrap canvas {
  display:block;
  width:100%;
  height:100%;
  border-radius:4px;
  background:rgba(0,0,0,.2);
}
.sparkline-wrap .filler {
  display:flex;
  align-items:center;
  justify-content:center;
  height:36px;
  font-size:.7rem;
  color:var(--gray);
  background:rgba(0,0,0,.2);
  border-radius:4px;
}
/* -------- empty -------- */
.empty {
  text-align:center;
  padding:40px 20px;
  color:var(--gray);
  font-size:.9rem;
}
.empty .big { font-size:2.5rem; margin-bottom:8px; }
/* -------- responsive -------- */
@media(max-width:768px){
  body { padding:12px; }
  .header h1 { font-size:1.2rem; }
  .summary { grid-template-columns:repeat(3,1fr); gap:8px; }
  .card { padding:12px; }
  .card .value { font-size:1.3rem; }
  .add-row { flex-direction:column; }
  .add-row button { width:100%; }
}
@media(max-width:480px){
  .summary { grid-template-columns:repeat(2,1fr); }
  .endpoint-top { gap:8px; }
  .endpoint-url { font-size:.85rem; }
  .endpoint-stats { flex-wrap:wrap; gap:8px; }
  .header h1 { font-size:1rem; letter-spacing:1px; }
}
</style>
<link id="site-canonical" rel="canonical" href="https://tools.soumendrak.com/t/uptime-radar">
<style id="site-theme-override">
:root[data-theme="dark"]{--bg:#231c17;--surface:#2d251f;--bg-card:#2d251f;--bg-toggle:#38302a;--card-bg:#2d251f;--card:#2d251f;--card2:#38302a;--border:#3a3129;--text:#f2ebe0;--fg:#f2ebe0;--text-dim:#b0a496;--text-muted:#8a7d6f;--muted:#b0a496;--accent:#d17d5c;--accent-light:#e19b7f;--accent-dark:#b4522e;--accent-dim:#b4522e;--accent-hover:#e19b7f;--accent-glow:rgba(209,125,92,.25);--accent-subtle:rgba(209,125,92,.12);--orange:#d17d5c;--orange-glow:rgba(209,125,92,.4);--orange-dim:rgba(209,125,92,.14);color-scheme:dark;}
:root[data-theme="light"]{--bg:#f7f0e6;--surface:#fdf8f0;--bg-card:#ffffff;--bg-toggle:#efe6d8;--card-bg:#ffffff;--card:#ffffff;--card2:#efe6d8;--border:#e6dccc;--text:#2a201a;--fg:#2a201a;--text-dim:#6f6255;--text-muted:#948676;--muted:#6f6255;--accent:#b4522e;--accent-light:#c96a44;--accent-dark:#9c4527;--accent-dim:#b4522e;--accent-hover:#9c4527;--accent-glow:rgba(180,82,46,.18);--accent-subtle:rgba(180,82,46,.08);--orange:#b4522e;--orange-glow:rgba(180,82,46,.28);--orange-dim:rgba(180,82,46,.12);color-scheme:light;}
</style>
<script id="site-theme-sync">(function(){function a(t){document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}var t;try{t=localStorage.getItem('theme');}catch(e){}if(!t){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}a(t);addEventListener('storage',function(e){if(e.key==='theme'&&e.newValue)a(e.newValue);});addEventListener('message',function(e){if(e.data&&e.data.__theme)a(e.data.__theme);});})();</script>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-left">
      <div class="radar-icon">📡</div>
      <div>
        <h1>Uptime <span>Radar</span></h1>
        <div class="proxy-input">
          <label>🔄 Proxy</label>
          <input type="text" id="proxyUrl" placeholder="https://corsproxy.io/?" spellcheck="false">
        </div>
      </div>
    </div>
    <div>
      <div style="font-size:.75rem;color:var(--gray)">⏱ <span id="timerDisplay">30</span>s</div>
      <div class="last-updated" id="lastUpdated">—</div>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="add-row">
    <input type="text" id="urlInput" placeholder="https://example.com" spellcheck="false">
    <button id="addBtn">+ Add Endpoint</button>
  </div>

  <div class="endpoints" id="endpoints"></div>
</div>

<script>
(function(){
  'use strict';

  const LS_KEY = 'uptime-radar-urls';
  const HISTORY_KEY = 'uptime-radar-history';
  const PROXY_KEY = 'uptime-radar-proxy';
  const MAX_HISTORY = 40;
  const PING_INTERVAL = 30000;
  const TIMEOUT_MS = 10000;

  const DEFAULTS = [
    'https://nini.ekathi.com',
    'https://reader.soumendrak.com',
    'https://cover.soumendrak.com'
  ];

  let urls = [];
  let history = {};       // url -> [ {latency, up, ts}, ... ]
  let proxyUrl = '';
  let timer = PING_INTERVAL / 1000;
  let pingTimer = null;
  let countdownTimer = null;
  let pingingNow = false;

  // ---- DOM refs ----
  const $ = id => document.getElementById(id);
  const summaryEl = $('summary');
  const endpointsEl = $('endpoints');
  const urlInput = $('urlInput');
  const addBtn = $('addBtn');
  const timerDisplay = $('timerDisplay');
  const lastUpdated = $('lastUpdated');
  const proxyInput = $('proxyUrl');

  // ---- load / save ----
  function load() {
    try {
      const u = localStorage.getItem(LS_KEY);
      urls = u ? JSON.parse(u) : [...DEFAULTS];
      const h = localStorage.getItem(HISTORY_KEY);
      history = h ? JSON.parse(h) : {};
      proxyUrl = localStorage.getItem(PROXY_KEY) || '';
      if (proxyInput) proxyInput.value = proxyUrl;
    } catch(e){ urls = [...DEFAULTS]; history = {}; proxyUrl = ''; }
    // prune orphan history
    Object.keys(history).forEach(k => { if(!urls.includes(k)) delete history[k]; });
  }
  function saveURLs() {
    localStorage.setItem(LS_KEY, JSON.stringify(urls));
  }
  function saveHistory() {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  }

  // ---- ping ----
  function pingURL(url) {
    const start = performance.now();
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    const fetchUrl = proxyUrl ? proxyUrl + url : url;
    const fetchOpts = proxyUrl
      ? { signal: ctrl.signal }
      : { mode: 'no-cors', signal: ctrl.signal };
    return fetch(fetchUrl, fetchOpts)
      .then(res => {
        clearTimeout(t);
        if (proxyUrl) {
          // With proxy we can read actual status
          const up = res.status >= 200 && res.status < 500;
          const latency = Math.round(performance.now() - start);
          return { up, latency, error: up ? null : ('HTTP ' + res.status), status: res.status };
        }
        const latency = Math.round(performance.now() - start);
        return { up: true, latency, error: null };
      })
      .catch(err => {
        clearTimeout(t);
        if (err.name === 'AbortError') {
          return { up: false, latency: null, error: 'Timeout' };
        }
        // no-cors means we can't read response, but if fetch didn't throw network error,
        // we actually got an opaque response — consider it "up" but unknown latency
        // However, TypeError usually means network failure (DNS / connect refused).
        if (err instanceof TypeError) {
          return { up: false, latency: null, error: 'Network error' };
        }
        return { up: false, latency: null, error: 'Error' };
      });
  }

  async function pingAll() {
    if (pingingNow) return;
    pingingNow = true;
    render(); // update checking dots

    const results = await Promise.allSettled(urls.map(url => pingURL(url)));

    const now = Date.now();
    results.forEach((r, i) => {
      const url = urls[i];
      if (!history[url]) history[url] = [];
      if (r.status === 'fulfilled') {
        const d = r.value;
        history[url].push({ latency: d.latency, up: d.up, ts: now });
      } else {
        history[url].push({ latency: null, up: false, ts: now });
      }
      // trim
      if (history[url].length > MAX_HISTORY) {
        history[url] = history[url].slice(-MAX_HISTORY);
      }
    });

    saveHistory();
    pingingNow = false;
    lastUpdated.textContent = new Date().toLocaleTimeString();
    render();
  }

  function startPinging() {
    stopPinging();
    pingAll(); // immediate
    pingTimer = setInterval(pingAll, PING_INTERVAL);
    // countdown
    timer = PING_INTERVAL / 1000;
    timerDisplay.textContent = timer;
    countdownTimer = setInterval(() => {
      timer--;
      timerDisplay.textContent = timer;
      if (timer <= 0) timer = PING_INTERVAL / 1000;
    }, 1000);
  }

  function stopPinging() {
    if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  }

  // ---- add / remove ----
  function addURL(raw) {
    let u = raw.trim();
    if (!u) return false;
    if (!u.startsWith('http://') && !u.startsWith('https://')) {
      u = 'https://' + u;
    }
    // basic host validation
    try { new URL(u); } catch(e) { return false; }
    if (urls.includes(u)) return false;
    urls.push(u);
    if (!history[u]) history[u] = [];
    saveURLs();
    saveHistory();
    render();
    return true;
  }

  function removeURL(url) {
    urls = urls.filter(u => u !== url);
    delete history[url];
    saveURLs();
    saveHistory();
    render();
  }

  // ---- render ----
  function computeStats() {
    const total = urls.length;
    let up = 0, down = 0, checking = 0;
    urls.forEach(url => {
      const h = history[url];
      if (!h || h.length === 0) { checking++; return; }
      const last = h[h.length - 1];
      if (pingingNow) checking++;
      else if (last.up) up++;
      else down++;
    });
    // calculate uptime % across all endpoints
    let totalPings = 0, totalUp = 0;
    urls.forEach(url => {
      const h = history[url] || [];
      h.forEach(p => { totalPings++; if(p.up) totalUp++; });
    });
    const uptimePct = totalPings > 0 ? ((totalUp / totalPings) * 100).toFixed(1) : '100.0';
    return { total, up, down, checking, uptimePct };
  }

  function renderSummary(stats) {
    const cards = [
      { label:'Total', value:stats.total, cls:'' },
      { label:'Up', value:stats.up, cls:'green' },
      { label:'Down', value:stats.down, cls:'red' },
      { label:'Checking', value:stats.checking, cls:'orange' },
      { label:'Uptime', value:stats.uptimePct + '%', cls:'pct accent' },
    ];
    summaryEl.innerHTML = cards.map(c =>
      `<div class="card ${c.cls}"><div class="label">${c.label}</div><div class="value">${c.value}</div></div>`
    ).join('');
  }

  function renderSparkline(url) {
    const h = history[url] || [];
    if (h.length < 2) {
      return '<div class="filler">waiting for data…</div>';
    }
    const canvasId = 'spk-' + url.replace(/[^a-zA-Z0-9]/g,'_');
    // We render via JS after mount — return canvas element
    return `<canvas id="${canvasId}" width="400" height="36"></canvas>`;
  }

  function drawSparkline(canvas, history) {
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);

    const data = history.map(p => p.up ? (p.latency || 1) : 0);
    const max = Math.max(...data, 1);
    const len = data.length;
    if (len < 2) return;

    const pad = 2;
    const drawW = w - pad*2;
    const drawH = h - pad*2;

    // background fill area
    ctx.beginPath();
    ctx.moveTo(pad, h - pad);
    data.forEach((v, i) => {
      const x = pad + (i / (len-1)) * drawW;
      const y = h - pad - (v / max) * drawH;
      ctx.lineTo(x, y);
    });
    ctx.lineTo(pad + drawW, h - pad);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0, 'rgba(46,204,113,.25)');
    grad.addColorStop(1, 'rgba(46,204,113,.02)');
    ctx.fillStyle = grad;
    ctx.fill();

    // line
    ctx.beginPath();
    data.forEach((v, i) => {
      const x = pad + (i / (len-1)) * drawW;
      const y = h - pad - (v / max) * drawH;
      if (i===0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = '#2ecc71';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // down points in red
    data.forEach((v, i) => {
      if (v === 0) {
        const x = pad + (i / (len-1)) * drawW;
        ctx.beginPath();
        ctx.arc(x, h - pad, 3, 0, Math.PI*2);
        ctx.fillStyle = '#e74c3c';
        ctx.fill();
      }
    });
  }

  function renderEndpoints() {
    if (urls.length === 0) {
      endpointsEl.innerHTML = `<div class="empty"><div class="big">🛸</div>No endpoints. Add one above.</div>`;
      return;
    }
    let html = '';
    urls.forEach(url => {
      const h = history[url] || [];
      const last = h.length > 0 ? h[h.length-1] : null;
      let statusClass = 'checking';
      if (!pingingNow && last) {
        statusClass = last.up ? 'up' : 'down';
      }
      const uptime = (() => {
        if (h.length === 0) return '—';
        const up = h.filter(p => p.up).length;
        return ((up / h.length) * 100).toFixed(0) + '%';
      })();
      const latency = last && last.up ? last.latency + 'ms' : '—';
      const httpStatus = last && last.status ? 'HTTP ' + last.status : '';

      html += `
        <div class="endpoint" data-url="${url.replace(/"/g,'&quot;')}">
          <div class="endpoint-top">
            <div class="status-dot ${statusClass}"></div>
            <span class="endpoint-url">${escapeHtml(url)}</span>
            <button class="btn-remove" data-action="remove">✕</button>
          </div>
          <div class="endpoint-stats">
            <span>latency <span class="latency">${latency}</span></span>
            <span>uptime <span class="uptime-pct">${uptime}</span></span>
            <span>pings <span class="uptime-pct">${h.length}</span></span>
            ${httpStatus ? `<span>status <span class="uptime-pct">${httpStatus}</span></span>` : ''}
          </div>
          <div class="sparkline-wrap">${renderSparkline(url)}</div>
        </div>`;
    });
    endpointsEl.innerHTML = html;

    // draw sparklines after mount
    urls.forEach(url => {
      const id = 'spk-' + url.replace(/[^a-zA-Z0-9]/g,'_');
      const canvas = document.getElementById(id);
      if (canvas) drawSparkline(canvas, history[url] || []);
    });

    // remove handlers (delegation on endpointsEl)
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function render() {
    const stats = computeStats();
    renderSummary(stats);
    renderEndpoints();
  }

  // ---- event delegation ----
  endpointsEl.addEventListener('click', e => {
    const btn = e.target.closest('[data-action="remove"]');
    if (!btn) return;
    const ep = btn.closest('.endpoint');
    if (!ep) return;
    const url = ep.getAttribute('data-url');
    if (url && confirm(`Remove ${url}?`)) {
      removeURL(url);
    }
  });

  addBtn.addEventListener('click', () => {
    const val = urlInput.value;
    if (addURL(val)) urlInput.value = '';
    else { urlInput.style.borderColor = 'var(--red)'; setTimeout(()=>{urlInput.style.borderColor='';},600); }
  });
  urlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') addBtn.click();
  });

  // Proxy URL change handler
  proxyInput.addEventListener('change', function() {
    proxyUrl = this.value.trim();
    if (proxyUrl && !proxyUrl.endsWith('/') && !proxyUrl.endsWith('?')) {
      proxyUrl += '/';
    }
    localStorage.setItem(PROXY_KEY, proxyUrl);
  });

  // ---- init ----
  load();
  render();
  startPinging();
  window.addEventListener('beforeunload', stopPinging);

  // ---- expose for debugging ----
  window.__uptimeRadar = { urls, history, addURL, removeURL, pingAll, render };
})();
</script>
</body>
</html>
