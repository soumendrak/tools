<!doctype html>
<html lang="or">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>୨୦୪୮ — 2048.openodia.com</title>
<meta name="description" content="ଓଡ଼ିଆ ସଂଖ୍ୟାରେ ୨୦୪୮ ଖେଳନ୍ତୁ। ଟାଇଲ୍ ଖସାନ୍ତୁ, ସଂଖ୍ୟା ଯୋଡ଼ନ୍ତୁ, ୨୦୪୮ ପ୍ରାପ୍ତ କରନ୍ତୁ।">
<script>(function(){try{var t=localStorage.getItem('od2048-theme');if(t==='dark'||(t===null&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark');}catch(e){}})()</script>
<style>
  :root{--bg:#f8f6f2;--surface:#fefcf8;--fg:#1a1a2e;--dim:#7a7a8e;--soft:#b8b8c8;--border:#e8e4dc;--accent:#ff7a45;--score-bg:#e8e4dc;--tile-2:#f0ebe0;--tile-4:#ede0c8;--tile-8:#f2b179;--tile-16:#f59563;--tile-32:#f67c5f;--tile-64:#f65e3b;--tile-128:#edcf72;--tile-256:#edcc61;--tile-512:#edc850;--tile-1024:#edc53f;--tile-2048:#edc22e;--tile-super:#3c3a32;--tile-txt-2:#1a1a2e;--tile-txt-4:#1a1a2e;--tile-txt-8:#fff;--tile-txt-16:#fff;--tile-txt-32:#fff;--tile-txt-64:#fff;--tile-txt-128:#fff;--tile-txt-256:#fff;--tile-txt-512:#fff;--tile-txt-1024:#fff;--tile-txt-2048:#fff;--tile-txt-super:#fff;--cell-bg:#cdc1b4;--board-bg:#bbada0;--radius:8px;--shadow:0 2px 8px rgba(0,0,0,0.06)}
  html.dark{--bg:#0f0d18;--surface:#171425;--fg:#f0ecf7;--dim:#9590a8;--soft:#5b556b;--border:#231f33;--accent:#ff8a5a;--score-bg:#1e1a2e;--tile-2:#e8e0d0;--tile-4:#f0d8a0;--tile-8:#c87530;--tile-16:#d08040;--tile-32:#d87840;--tile-64:#e06030;--tile-128:#c8a030;--tile-256:#d0b028;--tile-512:#d8b820;--tile-1024:#e0c010;--tile-2048:#e8c800;--tile-super:#f0e8d0;--tile-txt-2:#1a1a2e;--tile-txt-4:#1a1a2e;--tile-txt-8:#fff;--tile-txt-16:#fff;--tile-txt-32:#fff;--tile-txt-64:#fff;--tile-txt-128:#fff;--tile-txt-256:#fff;--tile-txt-512:#fff;--tile-txt-1024:#fff;--tile-txt-2048:#fff;--tile-txt-super:#fff;--cell-bg:#3a3450;--board-bg:#1e1a2e;--shadow:0 2px 12px rgba(0,0,0,0.3)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;overscroll-behavior:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overscroll-behavior:none;touch-action:none}
  .container{width:100%;max-width:420px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  h1{font-size:22px;font-weight:700;letter-spacing:-0.3px}
  h1 span{color:var(--accent)}
  .scores{display:flex;gap:6px}
  .score-box{background:var(--score-bg);border-radius:var(--radius);padding:4px 12px;text-align:center}
  .score-box label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
  .score-box .val{font-size:16px;font-weight:700}
  header .btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity 0.2s}
  header .btn:hover{opacity:0.85}
  .theme-btn{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:6px 8px;cursor:pointer;font-size:14px;color:var(--dim)}
  .board{background:var(--board-bg);border-radius:calc(var(--radius)+4px);padding:6px;position:relative;aspect-ratio:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;box-shadow:var(--shadow);touch-action:none;-ms-touch-action:none}
  .cell{background:var(--cell-bg);border-radius:var(--radius);aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}
  .tile{position:absolute;width:calc(25% - 4.5px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);font-weight:700;transition:top 0.1s,left 0.1s;z-index:2;font-size:clamp(12px,4.5vw,28px);user-select:none;transition:font-size 0.1s}
  @media(min-width:420px){.tile{width:calc(100px - 4.5px)}}
  .tile-2{background:var(--tile-2);color:#1a1a2e}
  .tile-4{background:var(--tile-4);color:#1a1a2e}
  .tile-8{background:var(--tile-8);color:var(--tile-txt-8)}
  .tile-16{background:var(--tile-16);color:var(--tile-txt-16)}
  .tile-32{background:var(--tile-32);color:var(--tile-txt-32)}
  .tile-64{background:var(--tile-64);color:var(--tile-txt-64)}
  .tile-128{background:var(--tile-128);color:var(--tile-txt-128)}
  .tile-256{background:var(--tile-256);color:var(--tile-txt-256)}
  .tile-512{background:var(--tile-512);color:var(--tile-txt-512)}
  .tile-1024{background:var(--tile-1024);color:var(--tile-txt-1024)}
  .tile-2048{background:var(--tile-2048);color:var(--tile-txt-2048)}
  .tile-super{background:var(--tile-super);color:var(--tile-txt-super)}
  @keyframes pop{0%{transform:scale(0);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  @keyframes merge{0%{transform:scale(1)}30%{transform:scale(1.2)}100%{transform:scale(1)}}
  .tile-new{animation:pop 0.2s ease-out}
  .tile-merge{animation:merge 0.2s ease-out;z-index:3}
  .footer{text-align:center;margin-top:16px;font-size:12px;color:var(--dim)}
  .footer a{color:var(--accent);text-decoration:none}
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5);border-radius:calc(var(--radius)+4px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;opacity:0;pointer-events:none;transition:opacity 0.3s}
  .overlay.show{opacity:1;pointer-events:auto}
  .overlay h2{font-size:32px;color:#fff;margin-bottom:8px}
  .overlay p{color:rgba(255,255,255,0.8);font-size:14px;margin-bottom:16px}
  .overlay .btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer}
</style>
<link id="site-canonical" rel="canonical" href="https://tools.soumendrak.com/t/odia-2048">
<style id="site-theme-override">
:root[data-theme="dark"]{--bg:#231c17;--surface:#2d251f;--bg-card:#2d251f;--bg-toggle:#38302a;--card-bg:#2d251f;--card:#2d251f;--card2:#38302a;--border:#3a3129;--text:#f2ebe0;--fg:#f2ebe0;--text-dim:#b0a496;--text-muted:#8a7d6f;--muted:#b0a496;--accent:#d17d5c;--accent-light:#e19b7f;--accent-dark:#b4522e;--accent-dim:#b4522e;--accent-hover:#e19b7f;--accent-glow:rgba(209,125,92,.25);--accent-subtle:rgba(209,125,92,.12);--orange:#d17d5c;--orange-glow:rgba(209,125,92,.4);--orange-dim:rgba(209,125,92,.14);color-scheme:dark;}
:root[data-theme="light"]{--bg:#f7f0e6;--surface:#fdf8f0;--bg-card:#ffffff;--bg-toggle:#efe6d8;--card-bg:#ffffff;--card:#ffffff;--card2:#efe6d8;--border:#e6dccc;--text:#2a201a;--fg:#2a201a;--text-dim:#6f6255;--text-muted:#948676;--muted:#6f6255;--accent:#b4522e;--accent-light:#c96a44;--accent-dark:#9c4527;--accent-dim:#b4522e;--accent-hover:#9c4527;--accent-glow:rgba(180,82,46,.18);--accent-subtle:rgba(180,82,46,.08);--orange:#b4522e;--orange-glow:rgba(180,82,46,.28);--orange-dim:rgba(180,82,46,.12);color-scheme:light;}
</style>
<script id="site-theme-sync">(function(){function a(t){document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}var t;try{t=localStorage.getItem('theme');}catch(e){}if(!t){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}a(t);addEventListener('storage',function(e){if(e.key==='theme'&&e.newValue)a(e.newValue);});addEventListener('message',function(e){if(e.data&&e.data.__theme)a(e.data.__theme);});})();</script>
</head>
<body>
<div class="container" id="app">
  <header>
    <h1>୨୦୪୮<span>.</span></h1>
    <div class="scores">
      <div class="score-box"><label>ସ୍କୋର</label><div class="val" id="score">0</div></div>
      <div class="score-box"><label>ସର୍ବୋତ୍ତମ</label><div class="val" id="best">0</div></div>
    </div>
    <button class="btn" onclick="reset()">ନୂଆ</button>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme">🌙</button>
  </header>

  <div class="board" id="board"></div>
  <div class="overlay" id="overlay">
    <h2 id="overlayTitle">ହାରିଗଲେ!</h2>
    <p id="overlayMsg">ପୁନର୍ବାର ଚେଷ୍ଟା କରନ୍ତୁ</p>
    <button class="btn" onclick="reset()">ପୁନର୍ବାର ଖେଳନ୍ତୁ</button>
  </div>
  <div class="footer">
    <a href="https://openodia.com">openodia.com</a> · ଓଡ଼ିଆ ୨୦୪୮
  </div>
</div>
<script>
const SIZE=4,STORAGE_BEST='od2048:best',STORAGE_THEME='od2048:theme';
const O={'0':'୦','1':'୧','2':'୨','3':'୩','4':'୪','5':'୫','6':'୬','7':'୭','8':'୮','9':'୯'};
function oN(n){return String(n).split('').map(c=>O[c]||c).join('')}
let board,score,best,over=false,won=false;

function emptyB(){return Array.from({length:SIZE},()=>Array(SIZE).fill(0))}
function clone(b){return b.map(r=>[...r])}
function addRand(b){let e=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!b[r][c])e.push([r,c]);if(!e.length)return b;let [r,c]=e[Math.random()*e.length|0],nb=clone(b);nb[r][c]=Math.random()<0.9?2:4;return nb}
function newB(){return addRand(addRand(emptyB()))}
function rot(b){let n=emptyB();for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)n[c][SIZE-1-r]=b[r][c];return n}
function slide(r){let f=r.filter(v=>v),g=0;for(let i=0;i<f.length-1;i++)if(f[i]===f[i+1]){f[i]*=2;g+=f[i];f.splice(i+1,1)}while(f.length<SIZE)f.push(0);return{row:f,gained:g}}
function move(b,d){let nb=clone(b),g=0;for(let i=0;i<4;i++){let row;if(d==='l')row=nb[i];else if(d==='r')row=[...nb[i]].reverse();else if(d==='u')row=nb.map(r=>r[i]);else row=nb.map(r=>r[i]).reverse();let sr=slide(row);g+=sr.gained;if(d==='l')nb[i]=sr.row;else if(d==='r')nb[i]=sr.row.reverse();else if(d==='u'){for(let j=0;j<4;j++)nb[j][i]=sr.row[j]}else{let rev=sr.row.reverse();for(let j=0;j<4;j++)nb[j][i]=rev[j]}}return{board:nb,gained:g}}
function hasMoves(b){for(let i=0;i<4;i++)for(let j=0;j<4;j++){if(!b[i][j])return 1;if(j<3&&b[i][j]===b[i][j+1])return 1;if(i<3&&b[i][j]===b[i+1][j])return 1}return 0}
function maxT(b){let m=0;for(let r of b)for(let v of r)if(v>m)m=v;return m}

function r(){
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){let t=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);if(t&&board[r][c]){t.textContent=oN(board[r][c]);t.className='tile tile-'+Math.min(board[r][c],4096);t.style.fontSize=Math.max(12,28-String(board[r][c]).length*3)+'px';t.style.left=(c*25+1)+'%';t.style.top=(r*25+1)+'%';t.style.display='flex';t.dataset.v=board[r][c]}else if(t){t.style.display='none'}}
}

function addTile(r,c,v,anim){
  let t=document.createElement('div');t.className='tile tile-'+Math.min(v,4096)+(anim==='new'?' tile-new':anim==='merge'?' tile-merge':'');t.textContent=oN(v);t.style.left=(c*25+1)+'%';t.style.top=(r*25+1)+'%';let d=String(v).length;t.style.fontSize=Math.max(12,28-d*3)+'px';t.dataset.r=r;t.dataset.c=c;t.dataset.v=v;document.getElementById('board').appendChild(t);setTimeout(()=>t.classList.remove('tile-new','tile-merge'),200)
}

function uS(){
  let s=document.getElementById('score');s.textContent=oN(score);try{let b=localStorage.getItem(STORAGE_BEST)||'0';if(score>parseInt(b)){localStorage.setItem(STORAGE_BEST,String(score));best=score}document.getElementById('best').textContent=oN(best)}catch(e){}
}

function checkGame(){
  let mt=maxT(board);if(mt>=2048&&!won){won=1;showOverlay('ଜିତିଗଲେ!','୨୦୪୮ ପ୍ରାପ୍ତ!','continue')}else if(!hasMoves(board)){showOverlay('ହାରିଗଲେ!',score+' ସ୍କୋର','retry')}
}

function showOverlay(t,m,b){
  let o=document.getElementById('overlay');document.getElementById('overlayTitle').textContent=t;document.getElementById('overlayMsg').textContent=m;o.classList.add('show')
}

function hideOverlay(){document.getElementById('overlay').classList.remove('show')}

function reset(){
  board=newB();score=0;over=0;won=0;hideOverlay();
  document.querySelectorAll('.tile').forEach(t=>t.remove());
  let bd=document.getElementById('board');
  document.querySelectorAll('.cell').forEach(c=>c.remove());
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){let d=document.createElement('div');d.className='cell';bd.appendChild(d)}
  r();uS()
}

function handleKey(e){
  if(over)return;let d={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'}[e.key];if(!d)return;e.preventDefault();
  let prev=clone(board),res=move(board,d);
  if(JSON.stringify(res.board)===JSON.stringify(board))return;
  score+=res.gained;board=res.board;
  document.querySelectorAll('.tile').forEach(t=>t.remove());
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(board[r][c])addTile(r,c,board[r][c],'')}
  let newB=addRand(board);board=newB;
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(board[r][c]&&!document.querySelector(`[data-r="${r}"][data-c="${c}"]`)){addTile(r,c,board[r][c],'new');break}}
  uS();checkGame()
}

function toggleTheme(){
  let h=document.documentElement;h.classList.toggle('dark');
  document.getElementById('themeBtn').textContent=h.classList.contains('dark')?'☀️':'🌙';
  try{localStorage.setItem(STORAGE_THEME,h.classList.contains('dark')?'dark':'light')}catch(e){}
}

// Touch handling
let tx=0,ty=0;
document.getElementById('board').addEventListener('touchstart',e=>{let t=e.touches[0];tx=t.clientX;ty=t.clientY;e.preventDefault()},{passive:false});
document.getElementById('board').addEventListener('touchend',e=>{
  e.preventDefault();
  let t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty,adx=Math.abs(dx),ady=Math.abs(dy);
  if(Math.max(adx,ady)<20)return;
  let d=adx>ady?(dx>0?'right':'left'):(dy>0?'down':'up');
  handleKey({key:'Arrow'+d.charAt(0).toUpperCase()+d.slice(1),preventDefault:()=>{}})
},{passive:false});

// Init
document.addEventListener('keydown',handleKey);
try{best=parseInt(localStorage.getItem(STORAGE_BEST))||0}catch(e){}
let savedTheme=null;try{savedTheme=localStorage.getItem(STORAGE_THEME)}catch(e){}
if(savedTheme==='dark'||(!savedTheme&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark');document.getElementById('themeBtn').textContent='☀️'}
board=newB();reset();
</script>
</body>
</html>
