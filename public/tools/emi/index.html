<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMI Calculator</title>
<meta name="description" content="Solve for EMI, loan amount, tenure, or interest rate — prepay to finish early or cut the EMI, compare prepaying against investing, Section 24 and 80C tax relief, moratorium, floating and flat rates, foreclosure, charts and a full amortization schedule.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff6e5; --surface: #ffffff; --text: #0d0d0d; --text-dim: #4a4a4a;
  --ink: var(--text); --ink-dim: var(--text-dim);
  --yellow: #ffdb58; --red: #ff6b6b; --teal: #4ecdc4; --purple: #a78bfa;
  --chart-principal: #4ecdc4; --chart-interest: #ff6b6b; --chart-fees: #a78bfa; --chart-balance: #0d0d0d;
  --chart-extra: #a78bfa;
  --grid-line: rgba(13,13,13,.13);
  --bw: 3px; --shadow: 5px 5px 0 var(--ink);
  --sans: "Space Grotesk", system-ui, sans-serif;
  --display: "Archivo Black", var(--sans);
}
:root[data-theme="dark"] { --chart-balance: #f2ebe0; --grid-line: rgba(242,235,224,.15); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh;
  background-image: radial-gradient(color-mix(in srgb, var(--ink) 7%, transparent) 1.2px, transparent 1.2px); background-size: 22px 22px; }
/* ponytail: hover tooltips are absolutely positioned and can reach past a narrow viewport.
   Clip on the root rather than chase each one — every genuinely wide block (chart, table)
   scrolls in its own container, so nothing real is lost. Must be on html, not body: an
   overflow set on body propagates to the viewport and leaves body itself visible. */
html { overflow-x: hidden; }
header { padding: 42px 24px 8px; text-align: center; }
header h1 { font-family: var(--display); font-size: 2.3rem; text-transform: uppercase; letter-spacing: .01em; }
header h1 mark { background: var(--yellow); color: #0d0d0d; padding: 0 8px; box-shadow: var(--shadow); border: var(--bw) solid var(--ink); }
header p { color: var(--text-dim); font-size: .95rem; font-weight: 500; margin-top: 12px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 30px 20px 72px; }
.layout { display: grid; grid-template-columns: 1.25fr .95fr; gap: 24px; }
.chart-panel, .table-panel, .about-panel, .bench-panel { grid-column: 1 / -1; }
.layout > .panel { min-width: 0; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

.panel { background: var(--surface); border: var(--bw) solid var(--ink); box-shadow: var(--shadow); padding: 24px; }
.panel h2 { font-family: var(--display); font-size: 1rem; text-transform: uppercase; margin-bottom: 16px; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.panel-head h2 { margin-bottom: 0; }
.table-note { font-family: var(--sans); font-size: .78rem; font-weight: 500; color: var(--text-dim); text-transform: none; }

/* tabs */
.mode-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 22px; }
.tab { font-family: var(--sans); font-size: .8rem; font-weight: 700; text-transform: uppercase; padding: 10px 4px; background: var(--surface); border: var(--bw) solid var(--ink); color: var(--text); cursor: pointer; box-shadow: 3px 3px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
.tab:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
.tab:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.tab.on { background: var(--yellow); color: #0d0d0d; }
@media (max-width: 480px) {
  .mode-tabs { grid-template-columns: repeat(2, 1fr); }
  .mode-tabs .tab:nth-child(odd)::after { left: 0; right: auto; transform: none; }
  .mode-tabs .tab:nth-child(even)::after { left: auto; right: 0; transform: none; }
}

.top-row { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 18px; border-bottom: var(--bw) dashed var(--ink); }
.field-group label, #scheme-label, #ratetype-label { display: block; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 7px; }
select, input[type="month"] { font-family: var(--sans); font-weight: 700; font-size: .88rem; padding: 8px 10px; border: var(--bw) solid var(--ink); background: var(--surface); color: var(--text); cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
select:focus, input:focus { outline: 3px solid var(--teal); outline-offset: 1px; }
.scheme-opts { display: flex; gap: 14px; padding-top: 7px; }
.radio { display: inline-flex; align-items: center; gap: 6px; font-size: .88rem; font-weight: 500; cursor: pointer; }
.radio input { accent-color: var(--ink); width: 16px; height: 16px; cursor: pointer; }

/* controls */
.ctrl { padding: 16px 0 12px; border-bottom: var(--bw) dashed color-mix(in srgb, var(--ink) 20%, transparent); }
.ctrl:last-child { border-bottom: none; }
.ctrl-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.ctrl-head label { font-size: .92rem; font-weight: 700; text-transform: uppercase; }
.field { display: inline-flex; align-items: center; gap: 6px; border: var(--bw) solid var(--ink); padding: 6px 10px; background: var(--surface); box-shadow: 3px 3px 0 var(--ink); }
.field:focus-within { outline: 3px solid var(--teal); outline-offset: 1px; }
.field .affix { font-size: .85rem; font-weight: 700; }
/* stretch so the tap target is the whole field, not just the text line */
.field input { align-self: stretch; font-family: var(--sans); font-size: .98rem; font-weight: 700; border: none; background: none; color: var(--text); width: 118px; text-align: right; font-variant-numeric: tabular-nums; }
.field input:focus { outline: none; }
.field.sm input { width: 84px; }
.tenure-right { display: flex; gap: 10px; align-items: center; }
.unit-toggle { display: inline-flex; border: var(--bw) solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.unit-toggle button { font-family: var(--sans); font-size: .78rem; font-weight: 700; padding: 8px 12px; border: none; background: var(--surface); color: var(--text); cursor: pointer; }
.unit-toggle button.on { background: var(--yellow); color: #0d0d0d; }

/* The track is drawn by the pseudo-element, so the input itself can be a full 44px tall grab
   area without the bar looking any thicker. Helps a thumb on a phone and a mouse on a laptop. */
.slider { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: none; border: none; cursor: pointer; display: block; }
.slider::-webkit-slider-runnable-track { height: 10px; background: var(--surface); border: 2px solid var(--ink); }
.slider::-moz-range-track { height: 10px; background: var(--surface); border: 2px solid var(--ink); }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 0; background: var(--yellow); border: var(--bw) solid var(--ink); box-shadow: 2px 2px 0 var(--ink); cursor: grab; }
.slider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 0; background: var(--yellow); border: var(--bw) solid var(--ink); cursor: grab; }
.slider:active::-webkit-slider-thumb { cursor: grabbing; }
.slider:focus-visible { outline: 3px solid var(--teal); outline-offset: -6px; }
.scale { display: flex; justify-content: space-between; font-size: .68rem; font-weight: 500; color: var(--text-dim); margin-top: 7px; }

/* buttons */
.btn { font-family: var(--sans); font-size: .76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 8px 12px; border: var(--bw) solid var(--ink); background: var(--surface); color: var(--text); cursor: pointer; box-shadow: 3px 3px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
.btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.accent { background: var(--yellow); color: #0d0d0d; }
.btn.x { padding: 6px 9px; box-shadow: 2px 2px 0 var(--ink); background: var(--red); color: #0d0d0d; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* advanced section */
.adv { margin-top: 18px; border: var(--bw) solid var(--ink); box-shadow: 3px 3px 0 var(--ink); background: var(--surface); }
.adv > summary { font-family: var(--display); font-size: .82rem; text-transform: uppercase; padding: 12px 14px; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.adv > summary::-webkit-details-marker { display: none; }
.adv > summary::after { content: "+"; font-family: var(--sans); font-weight: 700; font-size: 1.1rem; }
.adv[open] > summary { background: var(--yellow); color: #0d0d0d; border-bottom: var(--bw) solid var(--ink); }
.adv[open] > summary::after { content: "–"; }
.adv .adv-body { padding: 4px 14px 16px; }
.adv-badge { font-family: var(--sans); font-size: .64rem; font-weight: 700; background: var(--teal); color: #0d0d0d; border: 2px solid var(--ink); padding: 1px 7px; letter-spacing: .06em; margin-left: auto; margin-right: 8px; }
.adv-row { padding: 14px 0; border-bottom: 2px dashed color-mix(in srgb, var(--ink) 20%, transparent); }
.adv-row:last-child { border-bottom: none; }
.adv-row > .lbl { margin-bottom: 9px; }
.adv-row > .lbl label, .adv-row > .lbl span.h { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.adv-line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.adv-hint { font-size: .74rem; font-weight: 500; color: var(--text-dim); margin-top: 8px; }
.ev-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.ev-row .ev-lead { font-size: .78rem; font-weight: 700; color: var(--text-dim); }
input[type="month"] { padding: 7px 8px; box-shadow: 2px 2px 0 var(--ink); font-size: .82rem; }

/* results */
.result-hero { text-align: center; padding: 4px 0 20px; border-bottom: var(--bw) solid var(--ink); }
.result-label { display: inline-block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; background: var(--teal); color: #0d0d0d; border: 2px solid var(--ink); padding: 3px 10px; transform: rotate(-1deg); }
.result-value { font-family: var(--display); font-size: 2.5rem; margin-top: 12px; font-variant-numeric: tabular-nums; }
.result-sub { font-size: .86rem; font-weight: 500; color: var(--text-dim); margin-top: 4px; }
.msg { margin: 14px 0; padding: 12px 14px; border: var(--bw) solid var(--ink); background: var(--yellow); color: #0d0d0d; box-shadow: var(--shadow); font-size: .88rem; font-weight: 500; }
.savings { margin: 16px 0 4px; padding: 12px 14px; border: var(--bw) solid var(--ink); background: var(--teal); color: #0d0d0d; box-shadow: var(--shadow); }
.savings h3 { font-family: var(--display); font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.savings .s-line { display: flex; justify-content: space-between; gap: 12px; font-size: .86rem; font-weight: 500; padding: 3px 0; }
.savings .s-line b { font-variant-numeric: tabular-nums; }
.savings .s-split { margin-top: 8px; padding-top: 8px; border-top: 2px dashed rgba(13,13,13,.35); }
.savings .s-verdict { font-weight: 700; }
/* the savings box keeps its teal ground in both themes, so its contents stay on fixed colours —
   var(--ink) would invert to cream here and put yellow on cream */
.savings .s-verdict b { background: #0d0d0d; color: var(--yellow); padding: 0 6px; }
.savings .adv-hint { color: rgba(13,13,13,.7); }
.stats { padding: 8px 0; }
.stat { display: flex; justify-content: space-between; padding: 10px 2px; border-bottom: 2px dashed color-mix(in srgb, var(--ink) 20%, transparent); font-size: .92rem; gap: 12px; }
.stat-label { font-weight: 500; color: var(--text-dim); display: flex; align-items: center; }
.stat-value { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.stat.total { border-bottom: none; }
.stat.total .stat-label { color: var(--text); font-weight: 700; text-transform: uppercase; }
.stat.total .stat-value { background: var(--yellow); color: #0d0d0d; border: 2px solid var(--ink); padding: 1px 8px; box-shadow: 2px 2px 0 var(--ink); }

.donut-wrap { display: flex; align-items: center; gap: 18px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
#donut { width: 172px; height: 172px; flex-shrink: 0; }
.donut-big { font-family: var(--display); font-size: 26px; fill: var(--text); }
.donut-small { font-family: var(--sans); font-size: 12px; font-weight: 700; fill: var(--text-dim); }
.legend { display: flex; flex-direction: column; gap: 9px; font-size: .84rem; font-weight: 500; }
.legend .item { display: inline-flex; align-items: center; gap: 8px; }
.legend em { color: var(--text-dim); font-style: normal; }
.swatch { width: 13px; height: 13px; border: 2px solid var(--ink); flex-shrink: 0; }
.swatch.line { height: 4px; border-width: 1px; }
.chart-panel .legend { flex-direction: row; gap: 20px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.chart-scroll { overflow-x: auto; }
#barchart { width: 100%; min-width: 620px; height: auto; }
.grid { stroke: var(--grid-line); stroke-width: 1; stroke-dasharray: 3 3; }
.axis { font-family: var(--sans); font-size: 11px; font-weight: 500; fill: var(--text-dim); }
.bar-g rect { stroke: var(--ink); stroke-width: 1.5; }
.bar-g rect:hover { opacity: .85; }

/* table */
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 620px; border: var(--bw) solid var(--ink); }
th { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; text-align: right; padding: 10px 12px; background: var(--ink); color: var(--bg); }
th.col-yr { text-align: left; }
td { text-align: right; padding: 9px 12px; border-bottom: 2px solid color-mix(in srgb, var(--ink) 13%, transparent); font-variant-numeric: tabular-nums; font-weight: 500; }
td.col-yr { text-align: left; font-weight: 700; }
.yr-row { cursor: pointer; transition: background .12s; }
.yr-row:hover, .yr-row:focus-visible { background: var(--yellow); color: #0d0d0d; }
.yr-row:focus-visible { outline: 3px solid var(--teal); outline-offset: -3px; }
.chev { display: inline-block; width: 0; height: 0; border: 5px solid transparent; border-left: 7px solid currentColor; margin-right: 8px; transition: transform .15s; vertical-align: 0; }
.yr-row.open .chev { transform: rotate(90deg) translateX(1px); }
.mo-row { background: color-mix(in srgb, var(--ink) 4%, transparent); color: var(--text-dim); }
.mo-row td.col-yr { padding-left: 32px; font-weight: 500; }
.mo-row.is-mora td.col-yr::after { content: " · moratorium"; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }
.tag-extra { background: var(--purple); color: #0d0d0d; border: 1px solid var(--ink); padding: 0 5px; font-size: .74rem; font-weight: 700; }

/* pre-closure */
.closure { margin-top: 18px; padding: 14px; border: var(--bw) solid var(--ink); background: color-mix(in srgb, var(--yellow) 35%, var(--surface)); }
.closure h3 { font-family: var(--display); font-size: .78rem; text-transform: uppercase; margin-bottom: 10px; }
.closure .c-out { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.closure .c-cell { border: 2px solid var(--ink); background: var(--surface); padding: 9px 11px; min-width: 0; }
.closure .c-cell b { display: block; font-family: var(--display); font-size: 1.05rem; font-variant-numeric: tabular-nums; margin-top: 3px; overflow-wrap: anywhere; }
.closure .c-cell span { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); }

/* about / formulas */
.about-panel details { border-bottom: 2px dashed color-mix(in srgb, var(--ink) 20%, transparent); }
.about-panel details:last-child { border-bottom: none; }
.about-panel summary { font-weight: 700; font-size: .92rem; padding: 12px 2px; cursor: pointer; }
.about-panel summary:focus-visible { outline: 3px solid var(--teal); }
.about-panel .a-body { padding: 0 2px 16px; font-size: .88rem; font-weight: 500; color: var(--text-dim); }
.about-panel .a-body p { margin-bottom: 10px; }
.about-panel .a-body ul { margin: 0 0 10px 18px; }
.about-panel .a-body li { margin-bottom: 6px; }
.about-panel code, .formula { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.formula { display: block; white-space: pre; background: color-mix(in srgb, var(--ink) 6%, transparent); border-left: var(--bw) solid var(--ink); padding: 10px 12px; margin: 10px 0; font-size: .86rem; color: var(--text); overflow-x: auto; }

/* comparison — the entry point sits beside the result, not buried below */
.compare-cta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 18px; padding-top: 16px; border-top: var(--bw) dashed color-mix(in srgb, var(--ink) 30%, transparent); }
.btn.cmp { display: inline-flex; align-items: center; gap: 8px; background: var(--teal); color: #0d0d0d; }
.btn.cmp[disabled] { background: var(--surface); color: var(--text-dim); cursor: default; box-shadow: 2px 2px 0 color-mix(in srgb, var(--ink) 45%, transparent); border-color: color-mix(in srgb, var(--ink) 45%, transparent); transform: none; }
.btn.cmp .cmp-count { display: inline-flex; align-items: center; justify-content: center; min-width: 19px; height: 19px; padding: 0 5px; background: #0d0d0d; color: var(--yellow); font-size: .7rem; font-variant-numeric: tabular-nums; }
.btn.link { background: none; border: none; box-shadow: none; text-decoration: underline; text-underline-offset: 3px; padding: 8px 2px; }
.btn.link:hover { transform: none; box-shadow: none; color: var(--text); }

.bench { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.bench:empty { display: none; }
/* a brief nudge so the eye finds the panel the first time it appears */
@keyframes bench-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.bench-panel.just-added { animation: bench-in .22s ease-out both; }
.chip .nm-edit { font-family: var(--display); font-size: .76rem; text-transform: uppercase; width: 108px; border: 2px solid var(--ink); background: var(--surface); color: var(--text); padding: 0 3px; }
.chip .ed { position: absolute; top: -9px; right: 16px; width: 22px; height: 22px; border: 2px solid var(--ink); background: var(--yellow); color: #0d0d0d; font-size: .66rem; line-height: 1; cursor: pointer; padding: 0; }
.chip .ed:focus-visible, .chip .rm:focus-visible { outline: 3px solid var(--teal); outline-offset: 1px; }
/* same trick for the little chip controls — visually 22px, tappable at 44px */
.chip .ed, .chip .rm { position: absolute; }
.chip .ed::before, .chip .rm::before { content: ""; position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); }
.chip { position: relative; background: var(--surface); border: var(--bw) solid var(--ink); box-shadow: 3px 3px 0 var(--ink); min-width: 168px; transition: transform .12s, box-shadow .12s; }
.chip:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
.chip-main { display: block; width: 100%; padding: 9px 12px 9px 17px; background: none; border: none; text-align: left; font-family: var(--sans); color: var(--text); cursor: pointer; }
.chip-main:focus-visible { outline: 3px solid var(--teal); outline-offset: -3px; }
.chip .tab { position: absolute; left: 0; top: 0; bottom: 0; width: 7px; }
.chip .nm { display: block; font-family: var(--display); font-size: .76rem; text-transform: uppercase; }
.chip .sm { display: block; font-size: .72rem; font-weight: 500; color: var(--text-dim); font-variant-numeric: tabular-nums; margin-top: 1px; }
.chip .rm { position: absolute; top: -9px; right: -9px; width: 22px; height: 22px; border: 2px solid var(--ink); background: var(--red); color: #0d0d0d; font-weight: 700; font-size: .72rem; line-height: 1; cursor: pointer; padding: 0; }
.chip .rm:focus-visible { outline: 3px solid var(--teal); outline-offset: 1px; }
.bench-empty { border: var(--bw) dashed var(--ink); padding: 16px 18px; background: color-mix(in srgb, var(--yellow) 22%, transparent); }
.bench-empty p { font-size: .88rem; font-weight: 500; }
.bench-empty p + p { margin-top: 6px; color: var(--text-dim); }
.bench-hint { font-size: .78rem; color: var(--text-dim); font-weight: 500; margin-top: 10px; }
#matrix { width: 100%; border-collapse: collapse; font-size: .86rem; min-width: 560px; border: var(--bw) solid var(--ink); }
#matrix th, #matrix td { padding: 9px 12px; text-align: right; border-bottom: 2px solid color-mix(in srgb, var(--ink) 14%, transparent); font-variant-numeric: tabular-nums; }
#matrix thead th { background: var(--ink); color: var(--bg); font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; }
#matrix th.metric, #matrix td.metric { text-align: left; font-weight: 700; min-width: 148px; white-space: nowrap; }
/* with many scenarios the table scrolls sideways — pin the row labels so they stay readable */
#matrix td.metric { position: sticky; left: 0; background: var(--surface); z-index: 1; border-right: 2px solid color-mix(in srgb, var(--ink) 20%, transparent); }
#matrix thead th.metric { position: sticky; left: 0; background: var(--ink); z-index: 2; }
#matrix th:not(.metric), #matrix td:not(.metric) { min-width: 118px; }
#matrix tbody tr:last-child td { border-bottom: none; }
#matrix td.best { background: var(--yellow); color: #0d0d0d; font-weight: 700; }
#matrix tr.grand td { font-family: var(--display); font-size: .95rem; }
.win-badge { display: inline-flex; align-items: center; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; background: #0d0d0d; color: var(--yellow); padding: 2px 6px; margin-left: 6px; white-space: nowrap; }
.bench-bars { margin-top: 16px; }
.bb-row { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: center; margin-bottom: 8px; }
.bb-row .bl { font-size: .73rem; font-weight: 700; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bb-track { border: 2px solid var(--ink); height: 26px; background: var(--surface); position: relative; }

<body>
<header>
  <h1><mark>EMI</mark> Calculator</h1>
  <p>Solve for EMI, amount, tenure or rate — prepayments, prepay-vs-invest, tax relief, moratorium, floating &amp; flat rates.</p>
</header>
<div class="wrap"><div id="app"></div></div>
<script>
/* EMI calculator engine. Chart colors come from CSS vars:
   --chart-principal, --chart-interest, --chart-fees, --chart-extra, --chart-balance */
(function () {
  "use strict";

  const CURRENCIES = {
    INR: { sym: "₹", locale: "en-IN", amtMax: 5e7, amtStep: 1e5, amtDef: 2.5e6, emiMax: 5e5, emiStep: 1e3, emiDef: 25e3, feesMax: 1e6, feesStep: 5e3 },
    USD: { sym: "$", locale: "en-US", amtMax: 1e6, amtStep: 5e3, amtDef: 25e4, emiMax: 1e4, emiStep: 100, emiDef: 2200, feesMax: 25e3, feesStep: 250 },
    EUR: { sym: "€", locale: "de-DE", amtMax: 1e6, amtStep: 5e3, amtDef: 25e4, emiMax: 1e4, emiStep: 100, emiDef: 2200, feesMax: 25e3, feesStep: 250 },
    GBP: { sym: "£", locale: "en-GB", amtMax: 1e6, amtStep: 5e3, amtDef: 25e4, emiMax: 1e4, emiStep: 100, emiDef: 2200, feesMax: 25e3, feesStep: 250 },
  };
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const MAX_MONTHS = 1200; // 100 years — hard stop so a bad input can't spin forever

  const today = new Date();
  const S = {
    mode: "emi", currency: "INR", amount: 2.5e6, rate: 9, tenure: 240, tenureUnit: "yr",
    emi: 22493, fees: 0, scheme: "arrears",
    rateType: "reducing",                       // reducing | flat
    startY: today.getFullYear(), startM: today.getMonth(),
    yearMode: "cal",                            // cal | fy
    moraMonths: 0, moraType: "interest",        // interest (Pre-EMI) | full (deferred, capitalised)
    extraMonthly: 0,
    lumps: [],                                  // [{ month: 1-based payment no., amount }]
    rateSteps: [],                              // [{ month: 1-based payment no., rate: annual % }]
    closeAfter: 12, closeFeePct: 0,
    prepayMode: "tenure",                       // tenure (finish early) | emi (keep the end date, pay less)
    investReturn: 0,                            // % p.a. — compare prepaying against investing the same money
    taxSlab: 0,                                 // marginal income-tax rate %, 0 = claim nothing
    propType: "self",                           // self (Sec 24 capped) | letout (uncapped)
    taxRegime: "old",                           // old (24b + 80C) | new (24b on let-out only)
  };

  // saved scenarios for the comparison bench — each a full snapshot of S. No cap: the matrix
  // scrolls sideways and the chips wrap, so compare as many quotes as you have.
  let BENCH = [];
  // everything that changes a result; the bench stores exactly this and nothing view-related
  const SNAP_KEYS = ["mode", "currency", "amount", "rate", "tenure", "emi", "fees", "scheme",
    "rateType", "startY", "startM", "moraMonths", "moraType", "extraMonthly", "lumps", "rateSteps",
    "prepayMode", "taxSlab", "propType", "taxRegime"];
  const snapshot = () => {
    const o = {};
    for (const k of SNAP_KEYS) o[k] = Array.isArray(S[k]) ? S[k].map((x) => Object.assign({}, x)) : S[k];
    /* The flat branch of solve() ignores prepayments, holidays and rate steps. Carrying them into
       a flat snapshot would label the chip with terms that change none of its numbers, and would
       let two identical offers be saved as apparently distinct. */
    if (o.rateType === "flat") {
      o.extraMonthly = 0; o.lumps = []; o.rateSteps = []; o.moraMonths = 0; o.prepayMode = "tenure";
    }
    return o;
  };
  // restoring must hand S its own arrays, or editing an event afterwards rewrites the saved chip
  const restore = (snap) => {
    const o = {};
    for (const k in snap) o[k] = Array.isArray(snap[k]) ? snap[k].map((x) => Object.assign({}, x)) : snap[k];
    return o;
  };

  // ---------- math ----------
  const emiArrears = (P, r, n) => (r === 0 ? P / n : (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1));
  const emiFor = (P, r, n, scheme) => { const e = emiArrears(P, r, n); return scheme === "advance" ? e / (1 + r) : e; };
  function amountFor(E, r, n, scheme) {
    const Ee = scheme === "advance" ? E * (1 + r) : E;
    return r === 0 ? Ee * n : (Ee * (1 - Math.pow(1 + r, -n))) / r;
  }
  function tenureFor(P, E, r, scheme) {
    const Ee = scheme === "advance" ? E * (1 + r) : E;
    if (r === 0) return P / Ee;
    if (Ee <= P * r) return Infinity;
    return Math.log(Ee / (Ee - P * r)) / Math.log(1 + r);
  }
  function rateFor(P, E, n, scheme) {
    if (E * n < P) return NaN;
    let lo = 0, hi = 1;
    for (let i = 0; i < 100; i++) {
      const mid = (lo + hi) / 2;
      emiFor(P, mid, n, scheme) > E ? (hi = mid) : (lo = mid);
    }
    return (lo + hi) / 2;
  }
  // Flat ("fixed") rate loans: interest charged on the original principal for the whole tenure.
  const flatEmi = (P, flatPct, n) => (P + (P * flatPct / 100) * (n / 12)) / n;

  /* Monthly IRR of the real cash flow: the rate at which the payments actually made discount
     back to the money actually received. Used for APR (net of fees) and for the true cost of a
     flat-rate loan. A level-payment formula can't do this once a moratorium or a prepayment
     reshapes the payments. */
  function irrMonthly(net, flows, scheme) {
    if (!(net > 0) || !flows.length) return NaN;
    const paid = flows.reduce((a, x) => a + x, 0);
    // paying back exactly what you received is a real answer — an interest-free loan is 0%,
    // not "no rate fits". Only a genuine shortfall has no solution.
    if (Math.abs(paid - net) <= Math.max(net * 1e-9, 0.5)) return 0;
    if (paid < net) return NaN;
    const off = scheme === "advance" ? 0 : 1;
    const pv = (i) => flows.reduce((a, x, k) => a + x / Math.pow(1 + i, k + off), 0);
    let lo = 0, hi = 1;
    for (let k = 0; k < 40 && pv(hi) > net; k++) { lo = hi; hi *= 2; }
    for (let k = 0; k < 80; k++) {
      const mid = (lo + hi) / 2;
      pv(mid) > net ? (lo = mid) : (hi = mid);   // pv falls as the rate rises
    }
    return (lo + hi) / 2;
  }

  /* Month-by-month simulator. Handles moratorium, floating rate steps and prepayments.
     opts: { startY, startM, moraMonths, moraType, extraMonthly, lumps, rateSteps }
     Returns { rows, emiUsed, negAm }; rows carry {y,m,emi,principal,interest,extra,balance,mora}. */
  function simulate(P, annualRate, n, E, scheme, o) {
    const steps = (o.rateSteps || []).slice().sort((a, b) => a.month - b.month);
    const rateAt = (idx) => {                       // idx: 0-based month over the whole life
      let a = annualRate;
      for (const s of steps) if (idx + 1 >= s.month) a = s.rate;
      return a / 1200;
    };
    const rows = [];
    let bal = P, y = o.startY, m = o.startM, idx = 0;
    const step = () => { m++; if (m > 11) { m = 0; y++; } idx++; };

    const lumpsAt = (i) => (o.lumps || []).reduce((a, l) => a + (l.month === i + 1 ? l.amount : 0), 0);

    for (let k = 0; k < (o.moraMonths || 0); k++) {
      const interest = bal * rateAt(idx);
      let paid = 0;
      if (o.moraType === "full") bal += interest;   // deferred: interest capitalises
      else paid = interest;                          // Pre-EMI: interest serviced monthly
      // a lump sum dated inside the holiday still lands — otherwise it vanished silently
      let extra = Math.min(lumpsAt(idx), bal);
      bal -= extra;
      rows.push({ y, m, emi: paid, principal: 0, interest, extra, balance: bal, mora: true });
      step();
    }

    // After a full moratorium the balance has grown, so the EMI is re-struck over the agreed tenure.
    let emi = E;
    if (o.moraMonths > 0 && o.moraType === "full") emi = emiFor(bal, rateAt(idx), n, scheme);

    /* "Reduce the EMI" keeps the agreed end date: after every prepayment or rate change the
       instalment is re-struck over the months still left. With no prepayment and a flat rate this
       re-derives the same EMI, so it is a no-op — exactly as it should be. */
    const keepEnd = o.prepayMode === "emi";
    let negAm = false, emiIdx = 0, emiFirst = null;
    while (bal > 0.5 && rows.length < MAX_MONTHS) {
      const r = rateAt(idx);
      const left = n - emiIdx;
      if (keepEnd && left > 0) emi = emiFor(bal, r, left, scheme);
      if (emiFirst === null) emiFirst = emi;
      let extra = (o.extraMonthly || 0) + lumpsAt(idx);
      /* Advance scheme pays at the start of the month, so that month's interest accrues on what is
         left after the instalment AND any prepayment — charging interest on money already handed
         over would overstate both the interest and the payoff time. */
      const interest = scheme === "advance" ? Math.max(0, (bal - emi - extra) * r) : bal * r;
      if (emi + extra <= interest) { negAm = true; break; }  // payment never touches the principal
      let principal = Math.max(0, emi - interest);
      if (principal >= bal) { principal = bal; extra = 0; }
      else if (principal + extra > bal) extra = bal - principal;
      bal -= principal + extra;
      // the last instalment is usually a part payment, so record what was actually paid, not the level EMI
      rows.push({ y, m, emi: interest + principal, principal, interest, extra, balance: Math.max(bal, 0), mora: false });
      step(); emiIdx++;
    }
    return { rows, emiUsed: emiFirst === null ? emi : emiFirst, emiLast: emi, negAm };
  }

  /* Fair prepay-vs-invest comparison. Both paths commit the SAME money each month:
     A) prepay, clear the loan at nA, then invest the freed instalment until the original end date;
     B) keep the loan to its original end and invest the extra payments as they would have been made.
     Both end debt-free at nBase, so whichever pile of money is bigger wins. */
  /* Both paths are handed the same budget every month: the baseline instalment plus whatever
     prepayment was planned for that month. Whatever a path does not hand to the lender, it
     invests. Expressing it as "budget minus actually paid" is what makes the comparison honest —
     it automatically picks up the part-payment in a final month, a lump the schedule had to clamp,
     and months (a moratorium) where a prepayment was never applied at all. Earlier versions
     assumed every non-final month spent the whole budget, which quietly gifted one side cash. */
  function investCompare(rowsA, rowsB, nBase, baseEmi, extraMonthly, lumps, g) {
    const lumpAt = (i) => lumps.reduce((a, l) => a + (l.month === i + 1 ? l.amount : 0), 0);
    const paid = (rows, i) => (i < rows.length ? rows[i].emi + rows[i].extra : 0);
    let a = 0, b = 0;
    for (let i = 0; i < nBase; i++) {
      const budget = baseEmi + extraMonthly + lumpAt(i);
      const fv = Math.pow(1 + g, nBase - 1 - i);
      a += Math.max(0, budget - paid(rowsA, i)) * fv;
      b += Math.max(0, budget - paid(rowsB, i)) * fv;
    }
    return { prepay: a, invest: b };
  }

  /* Indian home-loan tax relief, by financial year (Apr–Mar).
     Sec 24(b): interest, capped at ₹2L for a self-occupied property. Sec 80C: principal, capped
     at ₹1.5L (and shared with your other 80C investments, so this is an upper bound). */
  const SEC24_CAP = 2e5, SEC80C_CAP = 1.5e5, PRECON_YEARS = 5;
  function taxRelief(rows, slabPct, propType, borrowed, regime) {
    const letout = propType === "letout";
    /* Under the new regime 80C is gone and Sec 24 survives only for a let-out property — a
       new-regime landlord still deducts interest against rental income. Treating "new regime" as
       "claim nothing" understated their relief. */
    const allow24 = slabPct > 0 && (regime !== "new" || letout);
    const allow80C = slabPct > 0 && regime !== "new";
    if (!allow24 && !allow80C) return null;
    /* After a full moratorium the schedule amortises P + capitalised interest, and that
       capitalised part has already been claimed as interest under Sec 24. Counting it again as
       80C principal would grant two deductions on the same rupee, so principal repayments are
       scaled by the share of the balance that is genuinely borrowed money. */
    const amortised = rows.reduce((a, x) => a + x.principal + x.extra, 0);
    const origShare = borrowed > 0 && amortised > borrowed ? borrowed / amortised : 1;
    const fy = new Map();
    const fyKey = (x) => (x.m >= 3 ? x.y : x.y - 1);     // FY starts in April
    const bucket = (key) => {
      if (!fy.has(key)) fy.set(key, { interest: 0, principal: 0, months: [] });
      return fy.get(key);
    };
    // relief is netted off real cash flows for the post-tax rate, so only months that actually
    // pay something can carry it — a full-moratorium month hands over nothing
    const pays = (x) => x.emi + x.extra > 0;
    /* Interest accrued before possession is "pre-construction interest": it is not deductible in
       the year it arises, but in five equal instalments from the year the property is completed.
       The moratorium is this tool's stand-in for that period, which is exactly the
       under-construction case the panel advertises. */
    let preCon = 0;
    rows.forEach((x, i) => {
      const g = bucket(fyKey(x));
      if (x.mora) preCon += x.interest;
      else g.interest += x.interest;
      g.principal += (x.principal + x.extra) * origShare;
      if (pays(x)) g.months.push(i);
    });
    const firstRepay = rows.find((x) => !x.mora);
    if (preCon > 0 && firstRepay) {
      const startFy = fyKey(firstRepay);
      for (let k = 0; k < PRECON_YEARS; k++) bucket(startFy + k).interest += preCon / PRECON_YEARS;
    }
    let saved = 0, savedInterest = 0;
    /* Only the Sec 24 interest relief belongs in the effective borrowing rate. Crediting the 80C
       principal relief against the rate too would flatter it badly — and that deduction is usually
       already used up by EPF and insurance anyway. */
    const perMonthI = new Array(rows.length).fill(0);
    for (const g of fy.values()) {
      // the ₹2L ceiling is a self-occupied rule; a let-out property deducts the full interest
      const i24 = allow24 ? (letout ? g.interest : Math.min(g.interest, SEC24_CAP)) : 0;
      const c80 = allow80C ? Math.min(g.principal, SEC80C_CAP) : 0;
      const yearI = i24 * slabPct / 100;
      saved += (i24 + c80) * slabPct / 100; savedInterest += yearI;
      // a pre-construction year can have no instalments of its own to carry the relief
      if (g.months.length) g.months.forEach((mi) => (perMonthI[mi] += yearI / g.months.length));
    }
    return { saved, savedInterest, perMonthI };
  }

  /* Flat-rate schedule. Interest is charged on the original principal, so the monthly interest is
     the constant P·f/1200 regardless of tenure. Driving the schedule off the instalment (rather
     than off n) means a solved-for tenure keeps the EMI the user typed and simply ends with a
     smaller final payment — the same way the reducing-balance schedule behaves. */
  function flatSchedule(P, flatPct, n, E, startY, startM) {
    const perI = (P * flatPct / 100) / 12;
    const rows = [];
    let y = startY, m = startM, bal = P;
    for (let i = 0; i < n && bal > 0.005; i++) {
      let principal = Math.max(0, E - perI);
      if (principal >= bal) principal = bal;         // final instalment is whatever is left
      bal -= principal;
      rows.push({ y, m, emi: principal + perI, principal, interest: perI, extra: 0, balance: Math.max(0, bal), mora: false });
      m++; if (m > 11) { m = 0; y++; }
    }
    return rows;
  }

  /* How much a full moratorium multiplies the balance before repayment starts. Pre-EMI holidays
     service the interest so the balance is untouched, giving a factor of 1. Rate steps inside the
     holiday are respected, so this matches what simulate() will actually do. */
  /* The balance a holiday hands to the repayment phase, expressed as
     `factor · P − lumpFV`, so the loan-amount inversion can be solved for P.
     A lump paid in the holiday keeps compounding out of the balance for the months that follow,
     which is why it needs its own future value rather than a flat subtraction. */
  function moraEffect(st) {
    const none = { factor: 1, lumpFV: 0 };
    if (!(st.moraMonths > 0) || st.rateType === "flat") return none;
    const steps = (st.rateSteps || []).slice().sort((a, b) => a.month - b.month);
    const capitalising = st.moraType === "full";
    const rateAt = (i) => {
      let a = st.rate;
      for (const s of steps) if (i + 1 >= s.month) a = s.rate;
      return a / 1200;
    };
    let factor = 1, lumpFV = 0;
    for (let i = 0; i < st.moraMonths; i++) {
      const grow = capitalising ? 1 + rateAt(i) : 1;   // Pre-EMI services the interest, so no growth
      factor *= grow;
      lumpFV *= grow;
      for (const l of st.lumps || []) if (l.month === i + 1) lumpFV += l.amount;
    }
    return { factor, lumpFV };
  }

  const advanced = (st) =>
    st.moraMonths > 0 || st.extraMonthly > 0 || st.lumps.length > 0 || st.rateSteps.length > 0;
  const anyAdvanced = () => advanced(S);

  // ---------- formatting ----------
  const cur = (code) => CURRENCIES[code || S.currency];
  const fmt = (v) => new Intl.NumberFormat(cur().locale, { maximumFractionDigits: 0 }).format(Math.round(v));
  const money = (v) => cur().sym + fmt(v);
  function short(v) {
    if (S.currency === "INR") {
      if (v >= 1e7) return trim(v / 1e7) + "Cr";
      if (v >= 1e5) return trim(v / 1e5) + "L";
      if (v >= 1e3) return trim(v / 1e3) + "k";
    } else {
      if (v >= 1e6) return trim(v / 1e6) + "M";
      if (v >= 1e3) return trim(v / 1e3) + "k";
    }
    return String(Math.round(v));
  }
  const trim = (x) => (Math.round(x * 10) / 10).toString().replace(/\.0$/, "");
  /* Percentages and month counts are rendered as raw numbers, so a plain parse is right for them. */
  const parseNum = (s) => parseFloat(String(s).replace(/[^0-9.]/g, "")) || 0;

  /* Money fields are rendered with Intl in the selected locale, so they must be read back the same
     way. de-DE writes 250000 as "250.000" — parsing that as a plain number gives 250. */
  const SEPS = {};
  function seps(locale) {
    if (!SEPS[locale]) {
      const parts = new Intl.NumberFormat(locale).formatToParts(12345.6);
      SEPS[locale] = {
        group: (parts.find((p) => p.type === "group") || {}).value || ",",
        decimal: (parts.find((p) => p.type === "decimal") || {}).value || ".",
      };
    }
    return SEPS[locale];
  }
  function parseMoney(s) {
    const { group, decimal } = seps(cur().locale);
    const t = String(s)
      .split(group).join("")            // drop the grouping separator, whatever it is
      .split(decimal).join(".")         // normalise the decimal mark
      .replace(/[^0-9.]/g, "");
    return parseFloat(t) || 0;
  }
  const cssVar = (name, fb) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fb;
  const tenureLabel = (months) => {
    const y = Math.floor(months / 12), mo = months % 12;
    return [y ? y + " yr" : "", mo || !y ? mo + " mo" : ""].filter(Boolean).join(" ");
  };
  const monthValue = (y, m) => y + "-" + String(m + 1).padStart(2, "0");
  const parseMonthValue = (v) => {
    const mt = /^(\d{4})-(\d{2})$/.exec(v || "");
    return mt ? { y: +mt[1], m: +mt[2] - 1 } : null;
  };
  // payment number (1-based) for a given calendar month, relative to the loan start
  const monthToIndex = (y, m) => (y - S.startY) * 12 + (m - S.startM) + 1;
  const indexToMonth = (i) => {
    const t = S.startM + (i - 1);
    return { y: S.startY + Math.floor(t / 12), m: ((t % 12) + 12) % 12 };
  };
  const indexLabel = (i) => { const d = indexToMonth(i); return MONTHS[d.m] + " " + d.y; };

  // Group rows into calendar or financial (Apr–Mar) years.
  function groupRows(rows) {
    const out = [];
    for (const r of rows) {
      const key = S.yearMode === "fy" ? (r.m >= 3 ? r.y : r.y - 1) : r.y;
      let g = out[out.length - 1];
      if (!g || g.key !== key) {
        g = {
          key, rows: [], principal: 0, interest: 0, extra: 0, paid: 0, balance: 0,
          label: S.yearMode === "fy" ? "FY " + key + "-" + String(key + 1).slice(2) : String(key),
          brief: S.yearMode === "fy" ? "FY" + String(key + 1).slice(2) : String(key),
        };
        out.push(g);
      }
      g.principal += r.principal; g.interest += r.interest; g.extra += r.extra;
      g.paid += r.emi;            // cash actually handed over — 0 during a full moratorium
      g.balance = r.balance; g.rows.push(r);
    }
    return out;
  }
