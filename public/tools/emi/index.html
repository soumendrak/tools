    <section class="panel about-panel">
      <h2>How this is calculated</h2>
      <details>
        <summary>The EMI formula, and the three inversions of it</summary>
        <div class="a-body">
          <p>On a reducing balance, with <code>P</code> = principal, <code>r</code> = monthly rate (annual ÷ 12 ÷ 100) and <code>n</code> = number of months:</p>
          <code class="formula">EMI = P × r × (1+r)^n / ((1+r)^n − 1)</code>
          <p>Rearranged, the same equation gives two of the other three answers:</p>
          <code class="formula">P = EMI × (1 − (1+r)^−n) / r
n = ln( EMI / (EMI − P×r) ) / ln(1+r)</code>
          <p>There is no closed form for <code>r</code> — this calculator finds it by bisection, halving the range 100 times until it converges. That is also why a hand calculation and a calculator can disagree: rounding the rate to a couple of decimals moves the EMI by a few units.</p>
          <p>On an <em>EMI in advance</em> loan the instalment is paid at the <em>start</em> of the month, so it is discounted by one month: <code>EMI_advance = EMI_arrears / (1+r)</code>.</p>
        </div>
      </details>
      <details>
        <summary>Flat rate vs reducing rate — why an 8% car loan isn't 8%</summary>
        <div class="a-body">
          <p>A <strong>flat rate</strong> charges interest on the whole original amount for the whole tenure, even though you owe less every month:</p>
          <code class="formula">Total interest = P × flat rate × years
EMI = (P + total interest) / n</code>
          <p>A <strong>reducing rate</strong> charges only on what is still outstanding. A flat rate is worth roughly <em>1.8–2×</em> its number in reducing terms — an 8% flat car loan is around 15% reducing. Switch Interest Type to Flat and the calculator shows both numbers.</p>
        </div>
      </details>
      <details>
        <summary>Prepayment, moratorium and floating rates</summary>
        <div class="a-body">
          <ul>
            <li><strong>Extra every month</strong> and <strong>lump sums</strong> go entirely against the principal, so every unit stops earning the lender interest for the rest of the loan. Keeping the EMI and paying extra is usually better than raising the EMI — the maths is identical, but you keep the option to stop.</li>
            <li><strong>Pre-EMI moratorium</strong>: you pay only the interest, the balance stands still, and the tenure grows by the length of the holiday.</li>
            <li><strong>Full moratorium</strong>: you pay nothing, the interest is added to the loan, and the EMI is re-struck on that larger balance.</li>
            <li><strong>Rate change</strong>: by default the EMI is held and the tenure moves — which is how a quarter-point rise can quietly add years to a loan without your monthly outgo changing at all.</li>
            <li><strong>Finish earlier vs lower the EMI</strong>: the same prepayment can do either. Finishing earlier keeps the instalment and simply ends the loan sooner, which saves the most interest. Lowering the EMI holds the end date and re-strikes the instalment on what is left, which frees up monthly cash but saves less. Banks must offer you the choice — set it above and compare the two.</li>
          </ul>
        </div>
      </details>
      <details>
        <summary>Prepay or invest? And what the tax relief is really worth</summary>
        <div class="a-body">
          <p>Prepaying earns you a guaranteed, tax-free return equal to your loan rate. Investing might earn more, but might not. The comparison is only honest if both paths cost the same each month, which is how this calculator does it: <strong>prepay</strong> clears the loan early and then invests the freed instalment until the original end date, while <strong>invest</strong> keeps the loan running and invests the extra as it goes. Both finish debt-free on the same date, so the bigger pile wins.</p>
          <p>For an Indian home loan the rate to beat is not the headline rate but the <strong>rate after tax relief</strong>. Section 24(b) allows up to ₹2,00,000 of interest a year on a self-occupied home (uncapped if it is let out), and Section 80C up to ₹1,50,000 of principal — though 80C is shared with your EPF, ELSS and insurance, so treat that half as a ceiling rather than a promise.</p>
          <p>Under the <strong>new regime</strong> 80C is gone and a self-occupied home gets nothing, but a <strong>let-out property still deducts its interest</strong> under Section 24(b) against rental income — so a landlord on the new regime is not claiming zero.</p>
          <p>Interest that accrues <strong>before possession</strong> is not deductible in the year it arises. It is held back and released in five equal yearly instalments starting when the property is completed, which is why a moratorium here defers its interest rather than claiming it. That deferral can lower your total relief, because bunching five years of interest against the same ₹2,00,000 ceiling wastes part of it.</p>
          <p>One simplification worth knowing: the cap on setting a house-property loss against your other income is not modelled, so a large let-out interest figure may be relieved here more generously than a return would allow.</p>
          <p>Both of these are estimates of the <em>past</em>, not forecasts. An expected return is an assumption; the interest you save by prepaying is arithmetic.</p>
        </div>
      </details>
      <details>
        <summary>APR, fees, and what "Loan Paid" means</summary>
        <div class="a-body">
          <p><strong>APR</strong> is the rate that makes the payments you actually make equal the money you actually receive. Fees, insurance and GST come out of what you receive, so a loan with a 9% headline rate and a 2% fee has an APR above 9%. Comparing two offers on APR is the only fair comparison.</p>
          <p><strong>Loan Paid</strong> in the schedule is the share of the <em>principal</em> repaid so far. It has nothing to do with the interest rate or the APR — early on you can be years in and still show a small percentage, because most of each EMI is interest.</p>
        </div>
      </details>
    </section>
  </div>`;

  // ---------- rendering ----------
  const $ = (id) => document.getElementById(id);
  const LAST = { rows: [], groups: [], P: 0, totalInterest: 0 };
  let DRAGGING = false, STALE_TABLE = false;   // see present(): the table is deferred during a drag

  function setSlider(id, min, max, step, val) {
    const el = $(id); el.min = min; el.max = max; el.step = step; el.value = val;
  }
  function scale(el, min, max, isMoney) {
    const ticks = 6, out = [];
    for (let i = 0; i < ticks; i++) {
      const v = min + ((max - min) * i) / (ticks - 1);
      out.push(`<span>${isMoney ? short(v) : trim(v)}</span>`);
    }
    el.innerHTML = out.join("");
  }

  /* Prepayment / rate-change rows are rebuilt only on add, remove or currency change —
     never while typing, or the input would lose focus mid-keystroke. */
  function renderEventRows() {
    $("lump-rows").innerHTML = S.lumps.map((l, i) => {
      const d = indexToMonth(l.month);
      return `<div class="ev-row" data-i="${i}">
        <span class="ev-lead">Pay</span>
        <div class="field sm"><span class="affix cursym">${cur().sym}</span><input class="lump-amt" inputmode="numeric" value="${fmt(l.amount)}" aria-label="Lump sum amount"></div>
        <span class="ev-lead">in</span>
        <input type="month" class="lump-when" value="${monthValue(d.y, d.m)}" aria-label="Lump sum month">
        <button type="button" class="btn x rm-lump" aria-label="Remove this lump sum">✕</button>
      </div>`;
    }).join("");
    $("step-rows").innerHTML = S.rateSteps.map((s, i) => {
      const d = indexToMonth(s.month);
      return `<div class="ev-row" data-i="${i}">
        <span class="ev-lead">From</span>
        <input type="month" class="step-when" value="${monthValue(d.y, d.m)}" aria-label="Rate change month">
        <span class="ev-lead">rate becomes</span>
        <div class="field sm"><input class="step-rate" inputmode="decimal" value="${s.rate}" aria-label="New interest rate"><span class="affix">%</span></div>
        <button type="button" class="btn x rm-step" aria-label="Remove this rate change">✕</button>
      </div>`;
    }).join("");
  }

  function syncControls() {
    const c = cur();
    document.querySelectorAll(".cursym").forEach((el) => (el.textContent = c.sym));
    setSlider("sl-amount", 0, c.amtMax, c.amtStep, Math.min(S.amount, c.amtMax));
    setSlider("sl-emi", 0, c.emiMax, c.emiStep, Math.min(S.emi, c.emiMax));
    setSlider("sl-fees", 0, c.feesMax, c.feesStep, Math.min(S.fees, c.feesMax));
    $("sl-rate").value = S.rate;
    if (S.tenureUnit === "yr") setSlider("sl-tenure", 1, 30, 1, Math.min(Math.round(S.tenure / 12), 30));
    else setSlider("sl-tenure", 6, 360, 6, Math.min(S.tenure, 360));
    scale($("sc-amount"), 0, c.amtMax, true);
    scale($("sc-emi"), 0, c.emiMax, true);
    scale($("sc-fees"), 0, c.feesMax, true);
    scale($("sc-rate"), 0.5, 20, false);
    scale($("sc-tenure"), S.tenureUnit === "yr" ? 1 : 6, S.tenureUnit === "yr" ? 30 : 360, false);
    const idle = (id) => document.activeElement !== $(id);
    if (idle("in-amount")) $("in-amount").value = fmt(S.amount);
    if (idle("in-emi")) $("in-emi").value = fmt(S.emi);
    if (idle("in-fees")) $("in-fees").value = fmt(S.fees);
    if (idle("in-rate")) $("in-rate").value = S.rate;
    /* Show the real tenure, not a rounded one: an 18-month loan displayed as "2" in years would
       silently become 24 months the moment the field is re-submitted. */
    if (idle("in-tenure")) {
      $("in-tenure").value = S.tenureUnit === "yr"
        ? +(S.tenure / 12).toFixed(2)   // 240 -> 20, 18 -> 1.5
        : S.tenure;
    }
    if (idle("in-extra")) $("in-extra").value = fmt(S.extraMonthly);
    if (idle("in-mora")) $("in-mora").value = S.moraMonths;
    if (idle("in-closefee")) $("in-closefee").value = S.closeFeePct;
    if (idle("in-invest")) $("in-invest").value = S.investReturn;
    $("mora-type").value = S.moraType;
    $("prepay-mode").value = S.prepayMode;
    $("prepay-hint").textContent = S.prepayMode === "emi"
      ? "The end date holds and the instalment is re-struck each time. Frees up cash, saves less interest."
      : "The EMI holds and the loan simply ends sooner. Saves the most interest — the usual advice.";
    // tax relief is Indian law, so only offer it on rupee loans
    $("tax").hidden = S.currency !== "INR";
    $("tax-slab").value = S.taxSlab;
    $("prop-type").value = S.propType;
    $("tax-regime").value = S.taxRegime;
    $("tax-hint").textContent = S.taxRegime === "new"
      ? (S.propType === "letout"
          ? "New regime: Section 24(b) interest is still deductible against rental income on a let-out property. Section 80C is not available."
          : "New regime: neither Section 24(b) nor 80C applies to a self-occupied home.")
      : "Section 24(b) covers interest — capped at ₹2,00,000 a year for a self-occupied home, uncapped if let out. Section 80C covers principal, capped at ₹1,50,000 and shared with your other 80C investments, so treat that half as an upper bound.";
    $("tax-badge").hidden = !(S.taxSlab > 0);
    $("start-month").value = monthValue(S.startY, S.startM);
    const cd = indexToMonth(S.closeAfter);
    $("close-month").value = monthValue(cd.y, cd.m);
    $("currency").value = S.currency;
    document.querySelectorAll('input[name="scheme"]').forEach((r) => (r.checked = r.value === S.scheme));
    document.querySelectorAll('input[name="ratetype"]').forEach((r) => (r.checked = r.value === S.rateType));
    document.querySelectorAll(".unit-toggle button[data-unit]").forEach((b) => b.classList.toggle("on", b.dataset.unit === S.tenureUnit));
    document.querySelectorAll("#year-toggle button").forEach((b) => b.classList.toggle("on", b.dataset.year === S.yearMode));
    document.querySelectorAll("#mode-tabs .tab").forEach((b) => {
      const on = b.dataset.mode === S.mode;
      b.classList.toggle("on", on); b.setAttribute("aria-selected", on);
      // roving tabindex: one Tab stop for the whole group, arrows move within it
      b.tabIndex = on ? 0 : -1;
    });
    // hide the control being solved for
    document.querySelectorAll(".ctrl[data-ctrl]").forEach((el) => {
      el.hidden = el.dataset.ctrl === S.mode;
    });
    // a flat-rate loan has no reducing balance, so none of the advanced options apply to it
    const flat = S.rateType === "flat";
    $("adv").hidden = flat;
    $("scheme-group").hidden = flat;
    $("adv-badge").hidden = flat || !anyAdvanced();
    $("stat-eff").style.display = flat ? "" : "none";
  }

  function showError(text) {
    const msg = $("msg"); msg.hidden = false; msg.textContent = text;
    $("result-value").textContent = "—"; $("result-sub").textContent = "";
    $("savings").hidden = true;
    // tax rows included, or an invalid input leaves the previous loan's relief on screen
    ["st-principal", "st-interest", "st-fees", "st-apr", "st-eff", "st-tax", "st-post", "st-total"]
      .forEach((id) => ($(id).textContent = "—"));
    $("stat-tax").style.display = "none"; $("stat-post").style.display = "none";
    $("donut").innerHTML = ""; $("donut-legend").innerHTML = "";
    $("barchart").innerHTML = ""; $("bar-legend").innerHTML = ""; $("sched-body").innerHTML = "";
    $("closure-out").innerHTML = "";
    LAST.rows = []; LAST.groups = [];
  }

  /* State in, schedule out — no DOM, no globals touched. The comparison bench runs every saved
     scenario through this same function, so the matrix can never drift from the main panel.
     Returns { error } or { rows, P, E, emiLast, baseEmi, solved, baseInterest, baseMonths }. */
  function solve(st) {
    let P = st.amount, n = st.tenure, E = st.emi, r = st.rate / 1200;
    const solved = {};
    const fail = (error) => ({ error });
    if (st.mode !== "amount" && P <= 0) return fail("Enter a loan amount greater than zero.");
    if (st.mode !== "tenure" && n <= 0) return fail("Enter a loan tenure greater than zero.");
    if (st.mode !== "tenure" && n > MAX_MONTHS) return fail("Tenure is capped at 100 years.");

    // ---- flat / fixed rate loans (vehicle & consumer finance) ----
    if (st.rateType === "flat") {
      let flatRate = st.rate;
      if (st.mode === "emi") { E = flatEmi(P, flatRate, n); solved.emi = Math.round(E); }
      else if (st.mode === "amount") {
        if (E <= 0) return fail("Enter a monthly EMI greater than zero.");
        P = (E * n) / (1 + (flatRate / 100) * (n / 12)); solved.amount = Math.round(P);
      } else if (st.mode === "tenure") {
        if (E <= 0) return fail("Enter a monthly EMI greater than zero.");
        // E = (P + P·f·n/12)/n   =>   n = P / (E − P·f/12)
        const monthlyFlatInterest = (P * flatRate / 100) / 12;
        if (E <= monthlyFlatInterest) return fail(`An EMI of ${money(E)} never covers the flat interest of ${money(monthlyFlatInterest)} a month. Raise the EMI or lower the rate.`);
        n = Math.ceil(P / (E - monthlyFlatInterest));
        if (n > MAX_MONTHS) return fail("That EMI would take over 100 years. Raise the EMI.");
        solved.tenure = n;
      } else {
        if (E <= 0) return fail("Enter a monthly EMI greater than zero.");
        // E·n === P is a perfectly good answer: a 0% promotional loan. Only a shortfall is an error.
        if (E * n < P - 0.5) return fail(`Total payments (${money(E * n)}) don't even repay the principal — no flat rate fits.`);
        // keep the exact rate for the schedule and round only what is displayed, or the entered
        // EMI (which matches the exact rate) leaves a residue after the last row
        flatRate = (E * n - P) / P / (n / 12) * 100;
        solved.rate = Math.round(flatRate * 100) / 100;
      }
      return { rows: flatSchedule(P, flatRate, n, E, st.startY, st.startM), P, E, emiLast: E, baseEmi: E,
        solved, baseInterest: null, baseMonths: null };
    }

    // ---- reducing balance ----
    let rate = st.rate;
    if (st.mode === "emi") {
      E = emiFor(P, r, n, st.scheme); solved.emi = Math.round(E);
    } else if (st.mode === "amount") {
      if (E <= 0) return fail("Enter a monthly EMI greater than zero.");
      /* A full moratorium capitalises interest, so the EMI is later re-struck on a grown balance.
         Solving as if repayment started today would hand back an amount whose real EMI is higher
         than the one asked for, so discount by the growth the holiday will apply. */
      // repayment starts on `factor·P − lumpFV`, and that has to equal the balance the requested
      // EMI amortises over n months — so solve that for P rather than discounting growth alone
      const eff = moraEffect(st);
      P = (amountFor(E, r, n, st.scheme) + eff.lumpFV) / eff.factor;
      if (!(P > 0)) return fail("Those holiday prepayments already clear the loan — lower them or raise the EMI.");
      solved.amount = Math.round(P);
    } else if (st.mode === "tenure") {
      if (E <= 0) return fail("Enter a monthly EMI greater than zero.");
      const nx = tenureFor(P, E, r, st.scheme);
      if (!isFinite(nx)) return fail(`EMI of ${money(E)} doesn't even cover the monthly interest — the loan would never be repaid. Increase the EMI or lower the rate.`);
      n = Math.ceil(nx - 1e-9);
      if (n > MAX_MONTHS) return fail("That EMI would take over 100 years to clear the loan. Increase the EMI.");
      solved.tenure = n;
    } else if (st.mode === "rate") {
      if (E <= 0) return fail("Enter a monthly EMI greater than zero.");
      const rx = rateFor(P, E, n, st.scheme);
      if (isNaN(rx)) return fail(`Total payments (${money(E * n)}) are less than the principal — no interest rate fits. Increase the EMI or the tenure.`);
      if (rx * 1200 > 100) return fail("The implied interest rate is over 100% p.a. — check the inputs.");
      /* Simulate on the exact rate and round only what is displayed. Rounding first can push an
         otherwise exact schedule one payment past its tenure (9.005% shown as 9.01% needs 241). */
      rate = rx * 1200; solved.rate = Math.round(rate * 100) / 100;
    }

    const opts = {
      startY: st.startY, startM: st.startM, moraMonths: st.moraMonths, moraType: st.moraType,
      extraMonthly: st.extraMonthly, lumps: st.lumps, rateSteps: st.rateSteps, prepayMode: st.prepayMode,
    };
    const sim = simulate(P, rate, n, E, st.scheme, opts);
    if (sim.negAm) return fail(`An EMI of ${money(sim.emiUsed)} never covers the monthly interest at this rate, so the loan would never be repaid. Increase the EMI or lower the rate.`);
    // hitting the cap is only an error if money is still owed — a loan that clears exactly on its
    // 1200th payment is a valid answer, and the tenure check above already allows that length
    if (sim.rows.length >= MAX_MONTHS && sim.rows[sim.rows.length - 1].balance > 0.5) {
      return fail("This loan takes over 100 years to clear. Check the EMI and the rate.");
    }

    // baseline with no moratorium, prepayment or rate change — for the savings comparison
    let baseInterest = null, baseMonths = null;
    if (advanced(st)) {
      const base = simulate(P, rate, n, E, st.scheme, { startY: st.startY, startM: st.startM });
      if (!base.negAm && base.rows.length < MAX_MONTHS) {
        baseInterest = base.rows.reduce((a, x) => a + x.interest, 0);
        baseMonths = base.rows.length;
      }
    }

    /* Prepay-vs-invest needs a different baseline from the savings box: the same loan with the
       prepayments removed but the holiday and rate steps kept. Reusing the strip-everything
       baseline compared against a loan the user never had, and a rate step could flip the verdict. */
    let noPrepayMonths = null, noPrepayEmi = null, noPrepayRows = null;
    if (st.extraMonthly > 0 || st.lumps.length) {
      const np = simulate(P, rate, n, E, st.scheme,
        Object.assign({}, opts, { extraMonthly: 0, lumps: [] }));
      if (!np.negAm && np.rows.length < MAX_MONTHS) {
        noPrepayMonths = np.rows.length;
        noPrepayEmi = np.emiUsed;
        noPrepayRows = np.rows;
      }
    }
    return { rows: sim.rows, P, E: sim.emiUsed, emiLast: sim.emiLast, baseEmi: E, solved,
      baseInterest, baseMonths, noPrepayMonths, noPrepayEmi, noPrepayRows };
  }

  function recalc() {
    $("msg").hidden = true;
    const res = solve(S);
    if (res.error) return showError(res.error);
    Object.assign(S, res.solved);   // write the solved-for value back into the inputs
    present(res);
  }

  function present(res) {
    const { rows, P, E, emiLast, baseEmi, baseInterest, baseMonths, noPrepayMonths, noPrepayEmi, noPrepayRows } = res;
    const n = rows.length;
    const totalInterest = rows.reduce((a, x) => a + x.interest, 0);
    /* What the schedule amortises. Under a full moratorium the deferred interest is capitalised,
       so this is bigger than the sum borrowed — it is the denominator for "Loan Paid", not a cost. */
    const amortised = rows.reduce((a, x) => a + x.principal + x.extra, 0);
    /* You borrowed P and every rupee beyond it is interest, so the money that leaves your pocket is
       P + interest + fees. Adding `amortised` here instead would count capitalised moratorium
       interest twice: once as interest when it accrues, again as principal when it is repaid. */
    const totalPrincipal = P;
    const totalPay = totalPrincipal + totalInterest + S.fees;
    LAST.rows = rows; LAST.groups = groupRows(rows); LAST.P = P; LAST.totalInterest = totalInterest;

    const lastStep = S.rateType === "reducing" && S.rateSteps.length
      ? S.rateSteps.slice().sort((a, b) => a.month - b.month).pop() : null;
    const rateTxt = S.rate + "% p.a." + (S.rateType === "flat" ? " flat" : "")
      + (lastStep ? " → " + lastStep.rate + "%" : "");
    const heroes = {
      emi: ["Monthly EMI", money(E), `${tenureLabel(n)} at ${rateTxt}`],
      amount: ["Loan Amount", money(S.amount), `EMI ${money(E)} · ${tenureLabel(n)} at ${rateTxt}`],
      tenure: ["Loan Tenure", tenureLabel(n), `EMI ${money(E)} at ${rateTxt} · ${n} payments`],
      rate: ["Interest Rate", rateTxt, `EMI ${money(E)} · ${tenureLabel(n)}`],
    }[S.mode];
    $("result-label").textContent = heroes[0];
    $("result-value").textContent = heroes[1];
    $("result-sub").textContent = heroes[2] + (n ? " · ends " + MONTHS[rows[n - 1].m] + " " + rows[n - 1].y : "");

    $("st-principal").textContent = money(totalPrincipal);
    $("st-interest").textContent = money(totalInterest);
    $("st-fees").textContent = money(S.fees);
    $("stat-fees").style.display = S.fees > 0 ? "" : "none";
    $("st-total").textContent = money(totalPay);

    // APR: the rate that equates the payments actually made to the cash actually received.
    const flows = rows.map((x) => x.emi + x.extra);
    if (S.fees > 0) {
      const apr = irrMonthly(P - S.fees, flows, S.scheme) * 1200;
      $("stat-apr").style.display = "";
      $("st-apr").textContent = isNaN(apr) ? "—" : apr.toFixed(2) + "% p.a.";
    } else {
      $("stat-apr").style.display = "none";
    }
    if (S.rateType === "flat") {
      const eff = irrMonthly(P, flows, "arrears") * 1200;
      $("st-eff").textContent = isNaN(eff) ? "—" : eff.toFixed(2) + "% p.a.";
    }

    if (baseInterest != null) {
      const dI = baseInterest - totalInterest, dN = baseMonths - n;
      let html = `
        <div class="s-line"><span>Interest without these changes</span><b>${money(baseInterest)}</b></div>
        <div class="s-line"><span>Interest now</span><b>${money(totalInterest)}</b></div>
        <div class="s-line"><span>${dI >= 0 ? "Interest saved" : "Extra interest"}</span><b>${money(Math.abs(dI))}</b></div>`;
      // "lower the EMI" holds the end date on purpose — reporting "0 mo" there reads like a bug
      if (dN !== 0) {
        html += `<div class="s-line"><span>${dN > 0 ? "Loan clears earlier by" : "Loan takes longer by"}</span><b>${tenureLabel(Math.abs(dN))}</b></div>`;
      }
      // in "lower the EMI" mode the end date is fixed, so the gain shows up as a falling instalment
      if (S.prepayMode === "emi" && Math.abs(emiLast - E) > 1) {
        html += `<div class="s-line"><span>EMI ${emiLast < E ? "falls" : "rises"} to</span><b>${money(emiLast)}</b></div>`;
      }
      html += prepayVsInvest(rows, n, noPrepayMonths, noPrepayEmi, noPrepayRows);
      $("savings").hidden = false;
      $("savings-body").innerHTML = html;
    } else {
      $("savings").hidden = true;
    }

    // ---- Indian home-loan tax relief ----
    const relief = S.currency === "INR" ? taxRelief(rows, S.taxSlab, S.propType, P, S.taxRegime) : null;
    if (relief) {
      $("stat-tax").style.display = ""; $("stat-post").style.display = "";
      $("st-tax").textContent = money(relief.saved);
      const netFlows = rows.map((x, i) => x.emi + x.extra - relief.perMonthI[i]);
      const post = irrMonthly(P - S.fees, netFlows, S.scheme) * 1200;
      $("st-post").textContent = isNaN(post) ? "—" : post.toFixed(2) + "% p.a.";
    } else {
      $("stat-tax").style.display = "none"; $("stat-post").style.display = "none";
    }

    drawDonut(totalPrincipal, totalInterest, S.fees, totalPay);
    drawBars(LAST.groups, P);
    /* Rebuilding 250-odd schedule rows costs more than a frame, so a slider drag skips it and
       the table is redrawn once on release. Every headline number still tracks the drag live. */
    if (!DRAGGING) drawTable(LAST.groups, amortised);
    else STALE_TABLE = true;
    drawClosure(rows, totalInterest);
    $("table-note").textContent = `· ${n} payments from ${MONTHS[S.startM]} ${S.startY}`;
  }

  /* "Should I prepay, or invest the same money?" — only meaningful once there is money being
     prepaid and a return to compare against. */
  /* The month of payment number `offset` counted from a start month. Adding the payment count to
     the start month names the anniversary, which is one month past the final instalment: 240
     payments from Jan 2026 end in Dec 2045, not Jan 2046. */
  const endLabel = (y, m, offset) => {
    const d = new Date(y, m + offset, 1);
    return MONTHS[d.getMonth()] + " " + d.getFullYear();
  };

  function prepayVsInvest(rows, n, baseMonths, baseEmi, baseRows) {
    const g = S.investReturn / 1200;
    const prepaid = rows.reduce((a, x) => a + x.extra, 0);
    if (!(S.investReturn > 0) || prepaid <= 0 || !baseMonths || baseMonths <= n) return "";
    const { prepay, invest } = investCompare(rows, baseRows, baseMonths, baseEmi, S.extraMonthly, S.lumps, g);
    const win = prepay >= invest;
    return `
      <div class="s-split">
        <div class="s-line"><span>Prepay, then invest the freed EMI</span><b>${money(prepay)}</b></div>
        <div class="s-line"><span>Keep the loan, invest the extra</span><b>${money(invest)}</b></div>
        <div class="s-line s-verdict"><span>${win ? "Prepaying" : "Investing"} wins by</span><b>${money(Math.abs(prepay - invest))}</b></div>
        <div class="adv-hint" style="margin:6px 0 0">Both paths put the same money in every month and are debt-free by ${endLabel(rows[0].y, rows[0].m, baseMonths - 1)}. Compared at ${S.investReturn}% a year.</div>
      </div>`;
  }

  // ---------- comparison bench ----------
  const BENCH_TABS = ["#4ecdc4", "#a78bfa", "#ff6b6b", "#3ddc84", "#ffdb58", "#60a5fa", "#f472b6", "#fb923c"];

  // scenario names are user text and land in markup and in quoted attributes
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* Lead with the rate — it is what actually differs between quotes. The amount is usually
     identical across a comparison, so putting it first made every chip look the same.
     Tenure keeps its months: rounding made an 18-month and a 24-month offer both read "2y". */
  function benchName(st, i) {
    if (st.name) return st.name;
    return st.rate + "%" + (st.rateType === "flat" ? " flat" : "") + " · " + tenureLabel(st.tenure);
  }
  function benchSub(st) {
    const bits = [cur(st.currency).sym + short(st.amount)];
    if (st.fees > 0) bits.push(short(st.fees) + " fee");
    if (st.extraMonthly > 0) bits.push("+" + short(st.extraMonthly) + "/mo");
    else if (st.lumps.length) bits.push(st.lumps.length + " lump" + (st.lumps.length > 1 ? "s" : ""));
    if (st.moraMonths > 0) bits.push(st.moraMonths + "mo holiday");
    if (st.rateSteps.length) bits.push("rate steps");
    return bits.join(" · ");
  }
  // identity of a scenario's inputs, so the same setup can't be saved twice
  const benchSig = (st) => JSON.stringify(SNAP_KEYS.map((k) => st[k]));

  /* One saved scenario -> the numbers the matrix compares. Memoised on the scenario's own
     signature: a slider drag calls drawBench() every frame, and re-solving up to 1,200 schedule
     rows per saved offer for snapshots that cannot have changed is pure waste. */
  const BENCH_CACHE = new Map();
  function benchEval(st) {
    const key = benchSig(st);
    if (BENCH_CACHE.has(key)) return BENCH_CACHE.get(key);
    const out = computeBench(st);
    if (BENCH_CACHE.size > 64) BENCH_CACHE.clear();
    BENCH_CACHE.set(key, out);
    return out;
  }
  function computeBench(st) {
    const r = solve(st);
    if (r.error) return { error: r.error };
    const interest = r.rows.reduce((a, x) => a + x.interest, 0);
    const flows = r.rows.map((x) => x.emi + x.extra);
    /* Always derive the APR from the real cash flows. Falling back to the quoted rate when there
       are no fees would report an 8% flat loan as 8% when it truly costs about 15%, and would
       ignore rate steps entirely — and this figure decides a "Best" badge. Flat schedules pay at
       month end, so they discount as arrears whatever the scheme setting says. */
    const apr = irrMonthly(r.P - st.fees, flows, st.rateType === "flat" ? "arrears" : st.scheme) * 1200;
    const last = r.rows[r.rows.length - 1];
    return {
      emi: r.E, interest, fees: st.fees, months: r.rows.length,
      // r.P, not the summed schedule principal — see present(): that double-counts capitalised
      // moratorium interest and could crown the wrong scenario cheapest
      total: r.P + interest + st.fees,
      apr: isNaN(apr) ? null : apr,
      end: last ? MONTHS[last.m] + " " + last.y : "—",
    };
  }

  /* Best value in a row, or -1 when every scenario ties — crowning a winner among
     identical numbers reads as a bug, not a recommendation. */
  function bestIndex(vals, lowerWins) {
    let bi = -1;
    vals.forEach((v, i) => {
      if (v == null || isNaN(v)) return;
      if (bi < 0 || (lowerWins ? v < vals[bi] : v > vals[bi])) bi = i;
    });
    if (bi < 0) return -1;
    /* Tolerance is relative and tiny: it exists only to absorb float noise between identical
       scenarios. An absolute floor would be wrong here — 0.5 is nothing in rupees but an
       enormous gap in percentage points. */
    const w = vals[bi], tol = Math.max(Math.abs(w) * 1e-9, 1e-9);
    /* Any other scenario matching the best value means there is no single winner. Checking only
       for an all-round tie crowned the first of two equally-good offers, e.g. fees [0, 0, 25000]
       badged the first zero and not the second. */
    const shared = vals.some((v, i) => i !== bi && v != null && !isNaN(v) && Math.abs(v - w) <= tol);
    return shared ? -1 : bi;
  }

  function drawBench() {
    const has = BENCH.length > 0;
    $("bench-panel").hidden = !has;
    $("btn-goto").hidden = !has;
    $("bench-note").textContent = has ? `· ${BENCH.length} saved` : "";

    // the call to action reflects exactly what pressing it would do right now
    const nowSig = benchSig(snapshot());
    const dup = BENCH.some((st) => benchSig(st) === nowSig);
    const btn = $("btn-compare"), count = $("cmp-count");
    count.hidden = !has; count.textContent = BENCH.length;
    btn.disabled = dup;
    $("cmp-label").textContent = dup ? "Already in comparison" : "+ Add to comparison";

    $("bench").innerHTML = BENCH.map((st, i) => `
      <div class="chip">
        <span class="tab" style="background:${BENCH_TABS[i % BENCH_TABS.length]}"></span>
        <button type="button" class="chip-main" data-i="${i}" aria-label="Load ${esc(benchName(st, i))} back into the calculator">
          <span class="nm">${esc(benchName(st, i))}</span>
          <span class="sm">${benchSub(st)}</span>
        </button>
        <button type="button" class="ed" data-ed="${i}" aria-label="Rename ${esc(benchName(st, i))}">✎</button>
        <button type="button" class="rm" data-rm="${i}" aria-label="Remove ${esc(benchName(st, i))}">✕</button>
      </div>`).join("");
    if (!has) { $("matrix").innerHTML = ""; $("bench-bars").innerHTML = ""; return; }

    const res = BENCH.map(benchEval);
    const bad = res.some((r) => r.error);
    const val = (k) => res.map((r) => (r.error ? null : r[k]));
    const rows = [
      ["Monthly EMI", val("emi"), true, money],
      ["Total interest", val("interest"), true, money],
      ["Fees & charges", val("fees"), true, money],
      ["APR incl. fees", val("apr"), true, (v) => (v == null ? "—" : v.toFixed(2) + "%")],
      ["Paid off in", val("months"), true, (v) => (v == null ? "—" : tenureLabel(v))],
      ["Debt-free by", val("end"), null, (v) => v || "—"],
    ];
    const multi = BENCH.length > 1;
    let html = `<thead><tr><th class="metric">Metric</th>${BENCH.map((st, i) =>
      `<th>${esc(benchName(st, i))}</th>`).join("")}</tr></thead><tbody>`;
    for (const [label, vals, lower, fmt] of rows) {
      const bi = multi && lower !== null ? bestIndex(vals, lower) : -1;
      html += `<tr><td class="metric">${label}</td>` + vals.map((v, i) =>
        `<td class="${i === bi ? "best" : ""}">${res[i].error ? "—" : fmt(v)}${i === bi ? '<span class="win-badge">Best</span>' : ""}</td>`).join("") + "</tr>";
    }
    const totals = val("total");
    const tb = multi ? bestIndex(totals, true) : -1;
    html += `<tr class="grand"><td class="metric">Total outgo</td>` + totals.map((v, i) =>
      `<td class="${i === tb ? "best" : ""}">${res[i].error ? "—" : money(v)}${i === tb ? '<span class="win-badge">Cheapest</span>' : ""}</td>`).join("") + "</tr></tbody>";
    $("matrix").innerHTML = html;

    // fills stop short of the label so the two never collide
    const max = Math.max(...totals.filter((v) => v != null), 1);
    $("bench-bars").innerHTML = BENCH.map((st, i) => {
      if (res[i].error) return `<div class="bb-row"><span class="bl">${esc(benchName(st, i))}</span><span class="muted" style="font-size:.78rem">can't be computed</span></div>`;
      return `<div class="bb-row">
        <span class="bl" title="${esc(benchName(st, i))}">${esc(benchName(st, i))}</span>
        <div class="bb-track"><div class="bb-fill" style="width:${(totals[i] / max * 68).toFixed(1)}%;background:${BENCH_TABS[i % BENCH_TABS.length]}"></div>
        <span class="bb-val">${money(totals[i])}</span></div>
      </div>`;
    }).join("");
    if (bad) $("bench-note").textContent += " · one scenario can't be computed";
  }

  /* Rename in place — "SBI" and "HDFC" is how people actually hold two quotes in their head,
     and an auto-generated label can't know that. */
  function renameChip(i) {
    const chip = $("bench").querySelector(`.chip-main[data-i="${i}"]`);
    const nm = chip && chip.querySelector(".nm");
    if (!nm) return;
    const input = document.createElement("input");
    input.className = "nm-edit";
    input.value = BENCH[i].name || benchName(BENCH[i], i);
    input.setAttribute("aria-label", "Scenario name");
    input.maxLength = 24;
    nm.replaceWith(input);
    input.focus(); input.select();
    const commit = () => {
      const v = input.value.trim();
      BENCH[i].name = v || undefined;   // blank falls back to the auto label
      drawBench();
    };
    input.addEventListener("blur", commit, { once: true });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
      else if (e.key === "Escape") { input.removeEventListener("blur", commit); drawBench(); }
      e.stopPropagation();
    });
    input.addEventListener("click", (e) => e.stopPropagation());
  }

  function drawDonut(pr, int, fees, total) {
    const C = 2 * Math.PI * 80;
    const segs = [
      { v: pr, color: cssVar("--chart-principal", "#4caf50"), label: "Principal" },
      { v: int, color: cssVar("--chart-interest", "#ff9800"), label: "Interest" },
    ];
    if (fees > 0) segs.push({ v: fees, color: cssVar("--chart-fees", "#9c27b0"), label: "Fees & Charges" });
    let off = 0, parts = "";
    for (const s of segs) {
      const frac = total ? s.v / total : 0;
      parts += `<circle cx="100" cy="100" r="80" fill="none" stroke="${s.color}" stroke-width="34"
        stroke-dasharray="${(frac * C).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off * C).toFixed(2)}"
        transform="rotate(-90 100 100)"><title>${s.label}: ${money(s.v)} (${(frac * 100).toFixed(1)}%)</title></circle>`;
      off += frac;
    }
    const intPct = total ? ((int / total) * 100).toFixed(1) : 0;
    parts += `<text x="100" y="94" text-anchor="middle" class="donut-big">${intPct}%</text>
      <text x="100" y="114" text-anchor="middle" class="donut-small">interest</text>`;
    $("donut").innerHTML = parts;
    $("donut-legend").innerHTML = segs
      .map((s) => `<span class="item"><span class="swatch" style="background:${s.color}"></span>${s.label} · ${money(s.v)} <em>(${total ? ((s.v / total) * 100).toFixed(1) : "0"}%)</em></span>`)
      .join("");
  }

  function drawBars(byYear, P) {
    if (!byYear.length) { $("barchart").innerHTML = ""; $("bar-legend").innerHTML = ""; return; }
    const W = 860, H = 340, padL = 64, padR = 64, padT = 16, padB = 44;
    const iw = W - padL - padR, ih = H - padT - padB;
    const maxPay = Math.max(...byYear.map((g) => g.principal + g.interest + g.extra)) || 1;
    const maxBal = Math.max(P, ...byYear.map((g) => g.balance)) || 1;
    const cp = cssVar("--chart-principal", "#4caf50"), ci = cssVar("--chart-interest", "#ff9800"),
      cx = cssVar("--chart-extra", "#9c27b0"), cb = cssVar("--chart-balance", "#4fc3f7");
    const n = byYear.length, bw = Math.min(40, (iw / n) * 0.62);
    const hasExtra = byYear.some((g) => g.extra > 0);
    let out = "";
    for (let i = 0; i <= 4; i++) {
      const v = (maxPay * i) / 4, y = padT + ih - (ih * i) / 4;
      out += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" class="grid"/>
        <text x="${padL - 8}" y="${y + 4}" text-anchor="end" class="axis">${short(v)}</text>`;
    }
    for (let i = 0; i <= 4; i++) {
      const v = (maxBal * i) / 4, y = padT + ih - (ih * i) / 4;
      out += `<text x="${W - padR + 8}" y="${y + 4}" text-anchor="start" class="axis axis-r">${short(v)}</text>`;
    }
    const xc = (i) => padL + (iw * (i + 0.5)) / n;
    byYear.forEach((g, i) => {
      const hP = (g.principal / maxPay) * ih, hI = (g.interest / maxPay) * ih, hX = (g.extra / maxPay) * ih;
      const x = xc(i) - bw / 2, yI = padT + ih - hI, yP = yI - hP, yX = yP - hX;
      out += `<g class="bar-g"><title>${g.label}
Principal: ${money(g.principal)}${g.extra ? "\nPrepaid: " + money(g.extra) : ""}
Interest: ${money(g.interest)}
Balance: ${money(g.balance)}</title>
        ${hX > 0 ? `<rect x="${x}" y="${yX}" width="${bw}" height="${hX}" fill="${cx}" rx="2"/>` : ""}
        <rect x="${x}" y="${yP}" width="${bw}" height="${hP}" fill="${cp}" rx="2"/>
        <rect x="${x}" y="${yI}" width="${bw}" height="${hI}" fill="${ci}" rx="2"/></g>`;
      const every = Math.ceil(n / 12);
      if (i % every === 0) out += `<text x="${xc(i)}" y="${H - padB + 20}" text-anchor="middle" class="axis">${g.brief}</text>`;
    });
    const pts = byYear.map((g, i) => `${xc(i)},${padT + ih - (g.balance / maxBal) * ih}`).join(" ");
    out += `<polyline points="${pts}" fill="none" stroke="${cb}" stroke-width="2.5" stroke-linejoin="round"/>`;
    byYear.forEach((g, i) => {
      out += `<circle cx="${xc(i)}" cy="${padT + ih - (g.balance / maxBal) * ih}" r="3.5" fill="${cb}"><title>Balance end ${g.label}: ${money(g.balance)}</title></circle>`;
    });
    $("barchart").innerHTML = out;
    $("bar-legend").innerHTML =
      `<span class="item"><span class="swatch" style="background:${cp}"></span>Principal</span>
       ${hasExtra ? `<span class="item"><span class="swatch" style="background:${cx}"></span>Prepaid</span>` : ""}
       <span class="item"><span class="swatch" style="background:${ci}"></span>Interest</span>
       <span class="item"><span class="swatch line" style="background:${cb}"></span>Outstanding balance</span>`;
  }

  // `amortised` is what the schedule pays down (principal, plus any capitalised interest), so the
  // Loan Paid column still reaches exactly 100% on the last row.
  function drawTable(byYear, amortised) {
    const showExtra = byYear.some((g) => g.extra > 0);
    document.querySelectorAll("#sched .col-extra").forEach((el) => (el.hidden = !showExtra));
    const hide = showExtra ? "" : " hidden";
    let cum = 0, html = "";
    for (const g of byYear) {
      const paid = g.principal + g.extra;
      cum += paid;
      html += `<tr class="yr-row" data-year="${g.key}" tabindex="0" role="button" aria-expanded="false">
        <td class="col-yr"><span class="chev" aria-hidden="true"></span>${g.label}</td>
        <td>${money(g.principal)}</td><td>${money(g.interest)}</td>
        <td class="col-extra"${hide}>${g.extra ? money(g.extra) : "—"}</td>
        <td>${money(g.paid + g.extra)}</td>
        <td>${money(g.balance)}</td><td class="col-paid">${((cum / amortised) * 100).toFixed(1)}%</td></tr>`;
      let mcum = cum - paid;
      for (const r of g.rows) {
        mcum += r.principal + r.extra;
        html += `<tr class="mo-row${r.mora ? " is-mora" : ""}" data-of="${g.key}" hidden>
          <td class="col-yr">${MONTHS[r.m]} ${r.y}</td>
          <td>${money(r.principal)}</td><td>${money(r.interest)}</td>
          <td class="col-extra"${hide}>${r.extra ? `<span class="tag-extra">${money(r.extra)}</span>` : "—"}</td>
          <td>${money(r.emi + r.extra)}</td><td>${money(r.balance)}</td>
          <td class="col-paid">${((mcum / amortised) * 100).toFixed(1)}%</td></tr>`;
      }
    }
    $("sched-body").innerHTML = html;
  }

  function drawClosure(rows, totalInterest) {
    if (!rows.length) { $("closure-out").innerHTML = ""; return; }
    const i = Math.min(Math.max(1, S.closeAfter), rows.length);
    const row = rows[i - 1];
    const paidInterest = rows.slice(0, i).reduce((a, x) => a + x.interest, 0);
    const paidOut = rows.slice(0, i).reduce((a, x) => a + x.emi + x.extra, 0);
    const charge = row.balance * (S.closeFeePct / 100);
    const cell = (label, value, tip) =>
      `<div class="c-cell"${tip ? ` title="${tip}"` : ""}><span>${label}</span><b>${value}</b></div>`;
    $("closure-out").innerHTML =
      cell("Outstanding after " + indexLabel(i), money(row.balance), "Principal still owed once that month's EMI is paid") +
      (S.closeFeePct > 0 ? cell("Foreclosure charge", money(charge)) : "") +
      cell("Pay to close", money(row.balance + charge), "What you hand the lender on that day") +
      cell("Paid so far", money(paidOut), "Every EMI and prepayment up to and including that month") +
      cell("Interest already paid", money(paidInterest)) +
      cell("Interest you'd save", money(Math.max(0, totalInterest - paidInterest)), "Interest you would otherwise have paid over the rest of the tenure");
  }

  // ---------- export ----------
  /* Plain numbers, no currency symbol — spreadsheets read the column as a number, not as text. */
  function tableRows() {
    const out = [["Month", "EMI", "Principal", "Interest", "Prepaid", "Total Paid", "Balance"]];
    for (const r of LAST.rows) {
      out.push([
        MONTHS[r.m] + " " + r.y,
        r.emi.toFixed(2), r.principal.toFixed(2), r.interest.toFixed(2),
        r.extra.toFixed(2), (r.emi + r.extra).toFixed(2), r.balance.toFixed(2),
      ]);
    }
    return out;
  }
  const toCSV = () => tableRows().map((r) => r.map((c) => (/[",]/.test(c) ? `"${c.replace(/"/g, '""')}"` : c)).join(",")).join("\n");
  const toTSV = () => tableRows().map((r) => r.join("\t")).join("\n");

  function flash(btn, text) {
    const old = btn.dataset.label || btn.textContent;
    btn.dataset.label = old;
    btn.textContent = text;
    setTimeout(() => (btn.textContent = old), 1600);
  }
  function copyText(text, btn, ok) {
    if (!navigator.clipboard) return flash(btn, "Copy unavailable");
    navigator.clipboard.writeText(text).then(() => flash(btn, ok), () => flash(btn, "Copy failed"));
  }

  // ---------- shareable URL ----------
  const SHORT = { mode: "md", currency: "cu", amount: "a", rate: "r", tenure: "t", tenureUnit: "tu", emi: "e", fees: "f", scheme: "s", rateType: "rt", yearMode: "ym", moraMonths: "mm", moraType: "mt", extraMonthly: "x", closeAfter: "ca", closeFeePct: "cf", prepayMode: "pm", investReturn: "ir", taxSlab: "ts", propType: "pt", taxRegime: "tr" };
  function writeURL() {
    const p = new URLSearchParams();
    for (const k in SHORT) p.set(SHORT[k], S[k]);
    p.set("sd", monthValue(S.startY, S.startM));
    if (S.lumps.length) p.set("l", S.lumps.map((l) => l.month + ":" + l.amount).join(","));
    if (S.rateSteps.length) p.set("rs", S.rateSteps.map((s) => s.month + ":" + s.rate).join(","));
    history.replaceState(null, "", location.pathname + location.search + "#" + p.toString());
  }
  function readURL() {
    const h = location.hash.slice(1);
    if (!h) return;
    const p = new URLSearchParams(h);
    for (const k in SHORT) {
      const v = p.get(SHORT[k]);
      if (v == null) continue;
      S[k] = typeof S[k] === "number" ? (parseFloat(v) || 0) : v;
    }
    const sd = parseMonthValue(p.get("sd"));
    if (sd) { S.startY = sd.y; S.startM = sd.m; }
    const pairs = (str) => (str || "").split(",").filter(Boolean).map((x) => x.split(":").map(Number));
    S.lumps = pairs(p.get("l")).filter((x) => x[0] >= 1 && x[1] > 0).map((x) => ({ month: x[0], amount: x[1] }));
    S.rateSteps = pairs(p.get("rs")).filter((x) => x[0] >= 1 && x[1] >= 0).map((x) => ({ month: x[0], rate: x[1] }));
    // anything hand-edited into the URL still has to be a value the UI can show
    if (!CURRENCIES[S.currency]) S.currency = "INR";
    if (!["emi", "amount", "tenure", "rate"].includes(S.mode)) S.mode = "emi";
    if (!["arrears", "advance"].includes(S.scheme)) S.scheme = "arrears";
    if (!["reducing", "flat"].includes(S.rateType)) S.rateType = "reducing";
    if (!["interest", "full"].includes(S.moraType)) S.moraType = "interest";
    if (!["cal", "fy"].includes(S.yearMode)) S.yearMode = "cal";
    if (!["tenure", "emi"].includes(S.prepayMode)) S.prepayMode = "tenure";
    if (!["self", "letout"].includes(S.propType)) S.propType = "self";
    if (!["old", "new"].includes(S.taxRegime)) S.taxRegime = "old";
    if (![0, 5, 10, 15, 20, 30].includes(S.taxSlab)) S.taxSlab = 0;
    S.investReturn = Math.min(100, Math.max(0, S.investReturn));
    if (!["yr", "mo"].includes(S.tenureUnit)) S.tenureUnit = "yr";
    S.startM = Math.min(11, Math.max(0, S.startM));
    S.moraMonths = Math.min(120, Math.max(0, Math.round(S.moraMonths)));
    S.closeAfter = Math.max(1, Math.round(S.closeAfter) || 1);
  }

  // ---------- events ----------
  function bind() {
    document.querySelectorAll("#mode-tabs .tab").forEach((b) =>
      b.addEventListener("click", () => { S.mode = b.dataset.mode; update(); }));
    /* role="tablist" promises arrow-key navigation, so honour it: arrows move between modes,
       Home/End jump to the ends, and only the selected tab stays in the tab order. */
    $("mode-tabs").addEventListener("keydown", (e) => {
      const tabs = [...$("mode-tabs").querySelectorAll(".tab")];
      const i = tabs.indexOf(document.activeElement);
      if (i < 0) return;
      let j = -1;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") j = (i + 1) % tabs.length;
      else if (e.key === "ArrowLeft" || e.key === "ArrowUp") j = (i - 1 + tabs.length) % tabs.length;
      else if (e.key === "Home") j = 0;
      else if (e.key === "End") j = tabs.length - 1;
      if (j < 0) return;
      e.preventDefault();
      S.mode = tabs[j].dataset.mode;
      update();
      tabs[j].focus();
    });
    $("currency").addEventListener("change", (e) => {
      S.currency = e.target.value;
      const c = cur();
      // ponytail: money fields reset on currency switch — values aren't convertible anyway
      S.amount = c.amtDef; S.emi = c.emiDef; S.fees = 0; S.extraMonthly = 0; S.lumps = [];
      BENCH = [];   // comparing a rupee quote against a dollar one would be meaningless
      renderEventRows(); update();
    });
    document.querySelectorAll('input[name="scheme"]').forEach((r) =>
      r.addEventListener("change", (e) => { S.scheme = e.target.value; update(); }));
    document.querySelectorAll('input[name="ratetype"]').forEach((r) =>
      r.addEventListener("change", (e) => { S.rateType = e.target.value; update(); }));
    $("prepay-mode").addEventListener("change", (e) => { S.prepayMode = e.target.value; update(); });
    $("tax-slab").addEventListener("change", (e) => { S.taxSlab = parseFloat(e.target.value) || 0; update(); });
    $("prop-type").addEventListener("change", (e) => { S.propType = e.target.value; update(); });
    $("tax-regime").addEventListener("change", (e) => { S.taxRegime = e.target.value; update(); });
    document.querySelectorAll(".unit-toggle button[data-unit]").forEach((b) =>
      b.addEventListener("click", () => { S.tenureUnit = b.dataset.unit; update(); }));
    document.querySelectorAll("#year-toggle button").forEach((b) =>
      b.addEventListener("click", () => { S.yearMode = b.dataset.year; update(); }));
    $("start-month").addEventListener("change", (e) => {
      const d = parseMonthValue(e.target.value);
      if (d) {
        // keep prepayments and rate steps on the same calendar months they were set for
        const shift = (d.y - S.startY) * 12 + (d.m - S.startM);
        S.lumps.forEach((l) => (l.month = Math.max(1, l.month - shift)));
        S.rateSteps.forEach((s) => (s.month = Math.max(1, s.month - shift)));
        S.startY = d.y; S.startM = d.m;
        renderEventRows();
      }
      update();
    });

    /* Dragging a 0.01-step slider fires far more input events than a coarse one, and each update
       rebuilds the schedule and charts. Coalescing to one update per animation frame keeps the
       drag at 60fps without dropping the final value. */
    let rafId = 0;
    const scheduleUpdate = () => {
      if (rafId) return;
      rafId = requestAnimationFrame(() => { rafId = 0; update(); });
    };
    /* A numeric input's text line is only ~24px tall inside its 46px box. Clicking the box's
       padding should still put the caret in it, so the whole field is the tap target. */
    document.addEventListener("click", (e) => {
      const f = e.target.closest(".field");
      if (f && e.target === f) f.querySelector("input")?.focus();
    });

    const endDrag = () => {
      if (!DRAGGING) return;
      DRAGGING = false;
      if (STALE_TABLE) { STALE_TABLE = false; update(); }   // catch the table up on release
    };
    // `isMoney` picks the parser: currency fields are locale-formatted, rates and counts are not
    const link = (slId, inId, set, isMoney) => {
      const read = () => (isMoney ? parseMoney : parseNum)($(inId).value);
      $(slId).addEventListener("pointerdown", () => { DRAGGING = true; });
      $(slId).addEventListener("input", () => { set(parseFloat($(slId).value)); scheduleUpdate(); });
      // fires once the drag ends (and after a keyboard nudge settles)
      $(slId).addEventListener("change", endDrag);
      $(slId).addEventListener("pointerup", endDrag);
      $(slId).addEventListener("pointercancel", endDrag);
      $(slId).addEventListener("blur", endDrag);
      $(inId).addEventListener("change", () => { set(read()); update(); });
      // Arrow keys move one step; with a 0.01 step that is a long way to 20%, so Shift and
      // Page keys give coarser jumps. Home/End go to the ends.
      $(slId).addEventListener("keydown", (e) => {
        const el = $(slId), step = parseFloat(el.step) || 1;
        const lo = parseFloat(el.min), hi = parseFloat(el.max);
        let d = 0;
        if (e.key === "ArrowUp" || e.key === "ArrowRight") d = e.shiftKey ? step * 10 : 0;
        else if (e.key === "ArrowDown" || e.key === "ArrowLeft") d = e.shiftKey ? -step * 10 : 0;
        else if (e.key === "PageUp") d = (hi - lo) / 20;
        else if (e.key === "PageDown") d = -(hi - lo) / 20;
        else if (e.key === "Home") d = lo - parseFloat(el.value);
        else if (e.key === "End") d = hi - parseFloat(el.value);
        if (!d) return;                       // let the browser handle a plain arrow key
        e.preventDefault();
        const next = Math.min(hi, Math.max(lo, parseFloat(el.value) + d));
        el.value = Math.round(next / step) * step;
        set(parseFloat(el.value));
        scheduleUpdate();
      });
    };
    link("sl-amount", "in-amount", (v) => (S.amount = Math.max(0, v)), true);
    link("sl-emi", "in-emi", (v) => (S.emi = Math.max(0, v)), true);
    link("sl-fees", "in-fees", (v) => (S.fees = Math.max(0, v)), true);
    // keep it to 2 decimals so 0.01 steps land clean and the input never shows float noise
    link("sl-rate", "in-rate", (v) => (S.rate = Math.round(Math.min(100, Math.max(0, v)) * 100) / 100));
    link("sl-tenure", "in-tenure",
      (v) => (S.tenure = Math.max(1, Math.round(S.tenureUnit === "yr" ? v * 12 : v))));

    $("in-extra").addEventListener("change", (e) => { S.extraMonthly = Math.max(0, parseMoney(e.target.value)); update(); });
    $("in-invest").addEventListener("change", (e) => { S.investReturn = Math.min(100, Math.max(0, parseNum(e.target.value))); update(); });
    $("in-mora").addEventListener("change", (e) => { S.moraMonths = Math.min(120, Math.max(0, Math.round(parseNum(e.target.value)))); update(); });
    $("mora-type").addEventListener("change", (e) => { S.moraType = e.target.value; update(); });
    $("in-closefee").addEventListener("change", (e) => { S.closeFeePct = Math.min(100, Math.max(0, parseNum(e.target.value))); update(); });
    $("close-month").addEventListener("change", (e) => {
      const d = parseMonthValue(e.target.value);
      if (d) S.closeAfter = Math.max(1, monthToIndex(d.y, d.m));
      update();
    });

    $("add-lump").addEventListener("click", () => {
      S.lumps.push({ month: Math.min(12, S.tenure), amount: Math.round(cur().amtDef / 25) });
      renderEventRows(); update();
    });
    $("add-step").addEventListener("click", () => {
      S.rateSteps.push({ month: Math.min(25, S.tenure), rate: S.rate });
      renderEventRows(); update();
    });
    $("adv-body").addEventListener("change", (e) => {
      const row = e.target.closest(".ev-row");
      if (!row) return;
      const i = +row.dataset.i, t = e.target, d = parseMonthValue(t.value);
      if (t.classList.contains("lump-amt")) S.lumps[i].amount = Math.max(0, parseMoney(t.value));
      else if (t.classList.contains("lump-when")) { if (d) S.lumps[i].month = Math.max(1, monthToIndex(d.y, d.m)); }
      else if (t.classList.contains("step-rate")) S.rateSteps[i].rate = Math.min(100, Math.max(0, parseNum(t.value)));
      else if (t.classList.contains("step-when")) { if (d) S.rateSteps[i].month = Math.max(1, monthToIndex(d.y, d.m)); }
      else return;
      update();
    });
    $("adv-body").addEventListener("click", (e) => {
      const row = e.target.closest(".ev-row");
      if (!row) return;
      if (e.target.classList.contains("rm-lump")) S.lumps.splice(+row.dataset.i, 1);
      else if (e.target.classList.contains("rm-step")) S.rateSteps.splice(+row.dataset.i, 1);
      else return;
      renderEventRows(); update();
    });

    $("btn-copy").addEventListener("click", (e) => copyText(toTSV(), e.currentTarget, "Copied ✓"));
    $("btn-csv").addEventListener("click", () => {
      const blob = new Blob([toCSV()], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `amortization-${S.currency}-${Math.round(S.amount)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
    $("btn-share").addEventListener("click", (e) => { writeURL(); copyText(location.href, e.currentTarget, "Link copied ✓"); });
    $("btn-reset").addEventListener("click", () => {
      history.replaceState(null, "", location.pathname + location.search);
      location.reload();
    });

    $("sched-body").addEventListener("click", (e) => {
      const tr = e.target.closest("tr.yr-row");
      if (tr) toggleYear(tr);
    });
    $("sched-body").addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("yr-row")) {
        e.preventDefault(); toggleYear(e.target);
      }
    });

    $("btn-compare").addEventListener("click", () => {
      const first = BENCH.length === 0;
      BENCH.push(snapshot());
      drawBench();
      flash($("cmp-label"), "Added ✓");
      // on the first save the panel appears from nothing — point the eye at it
      if (first) {
        const p = $("bench-panel");
        p.classList.add("just-added");
        p.addEventListener("animationend", () => p.classList.remove("just-added"), { once: true });
      }
    });
    $("btn-goto").addEventListener("click", () => {
      $("bench-panel").scrollIntoView({ block: "start", behavior: "smooth" });
    });
    $("bench-clear").addEventListener("click", () => { BENCH = []; drawBench(); });
    // all three are real buttons, so Enter/Space come through as clicks for free
    $("bench").addEventListener("click", (e) => {
      const rm = e.target.closest("[data-rm]");
      if (rm) { BENCH.splice(+rm.dataset.rm, 1); drawBench(); return; }
      const ed = e.target.closest("[data-ed]");
      if (ed) { renameChip(+ed.dataset.ed); return; }
      const chip = e.target.closest(".chip-main[data-i]");
      if (chip) { Object.assign(S, restore(BENCH[+chip.dataset.i])); renderEventRows(); update(); }
    });

    // a shared link pasted into an already-open tab changes only the hash — no reload fires
    addEventListener("hashchange", () => {
      const was = S.currency;
      readURL();
      // a shared link can switch currency without the select ever firing; the matrix formats every
      // value in the current currency, so mixed scenarios would rank rupees against dollars
      if (S.currency !== was) BENCH = [];
      renderEventRows(); update();
    });

    // redraw charts when the site toggles light/dark (colors are baked into the SVG)
    new MutationObserver(() => update()).observe(document.documentElement, {
      attributes: true, attributeFilter: ["data-theme"],
    });
  }
  function toggleYear(tr) {
    const open = tr.classList.toggle("open");
    tr.setAttribute("aria-expanded", open);
    document.querySelectorAll(`tr.mo-row[data-of="${tr.dataset.year}"]`).forEach((r) => (r.hidden = !open));
  }

  let urlTimer;
  function update() {
    syncControls();
    recalc();
    drawBench();
    clearTimeout(urlTimer);
    urlTimer = setTimeout(writeURL, 400);   // one history entry rewrite per pause, not per slider tick
  }

  $("app").innerHTML = APP_HTML;
  document.querySelectorAll(".info[data-tip]").forEach((el) => {
    el.setAttribute("role", "note"); el.setAttribute("aria-label", el.dataset.tip);
  });
  readURL();
  renderEventRows();
  bind();
  update();

  // ---- self-checks: the math that matters. Console only. ----
  (function selfCheck() {
    const ok = (cond, name) => console.assert(cond, name + " failed");
    const r9 = 0.09 / 12, base = { startY: 2026, startM: 0 };
    const E9 = emiFor(2.5e6, r9, 240, "arrears");
    ok(Math.abs(E9 - 22493.13) < 1, "EMI formula");
    ok(Math.abs(amountFor(E9, r9, 240, "arrears") - 2.5e6) < 100, "amount inverse");
    ok(Math.abs(tenureFor(2.5e6, E9, r9, "arrears") - 240) < 0.5, "tenure inverse");
    ok(Math.abs(rateFor(2.5e6, E9, 240, "arrears") * 1200 - 9) < 0.01, "rate inverse");

    // a plain schedule closes out in exactly n months, and its interest matches EMI×n − P
    const plain = simulate(2.5e6, 9, 240, E9, "arrears", base);
    ok(plain.rows.length === 240, "plain schedule length");
    ok(Math.abs(plain.rows.reduce((a, x) => a + x.interest, 0) - (E9 * 240 - 2.5e6)) < 5, "plain total interest");
    ok(plain.rows[239].balance < 1, "plain closes to zero");
    ok(plain.rows[0].m === 0 && plain.rows[12].y === 2027, "schedule starts at the loan start month");

    // MANISH KUMAR's case: 12,07,044 at 14% over 180 months, +5000/month -> around 96 months
    const E14 = emiFor(1207044, 0.14 / 12, 180, "arrears");
    const fast = simulate(1207044, 14, 180, E14, "arrears", Object.assign({ extraMonthly: 5000 }, base));
    ok(fast.rows.length > 90 && fast.rows.length < 105, "extra monthly shortens tenure to ~96");
    ok(fast.rows[fast.rows.length - 1].balance < 1, "prepaid loan closes to zero");

    // a lump sum lands only in its own month, and shortens the loan
    const lump = simulate(2.5e6, 9, 240, E9, "arrears", Object.assign({ lumps: [{ month: 13, amount: 5e5 }] }, base));
    ok(lump.rows[12].extra === 5e5 && lump.rows[11].extra === 0, "lump sum lands on its month");
    ok(lump.rows.length < 240, "lump sum shortens the tenure");

    // Pre-EMI moratorium: the balance is untouched and the tenure grows by the holiday
    const mora = simulate(2.5e6, 9, 240, E9, "arrears", Object.assign({ moraMonths: 12, moraType: "interest" }, base));
    ok(Math.abs(mora.rows[11].balance - 2.5e6) < 1, "Pre-EMI leaves the principal alone");
    ok(mora.rows.length === 252, "Pre-EMI adds the holiday to the tenure");

    // full moratorium capitalises the interest, so the re-struck EMI is larger
    const defer = simulate(2.5e6, 9, 240, E9, "arrears", Object.assign({ moraMonths: 12, moraType: "full" }, base));
    ok(defer.rows[11].balance > 2.5e6, "deferred interest capitalises");
    ok(defer.emiUsed > E9, "EMI re-struck after a full moratorium");
    ok(defer.rows.length === 252, "full moratorium keeps the agreed tenure after the holiday");

    // Sudharsanan's case: rate drops 8.6 -> 6.9 after 24 months, EMI held, so the loan ends sooner
    const E86 = emiFor(2.5e6, 0.086 / 12, 240, "arrears");
    const drop = simulate(2.5e6, 8.6, 240, E86, "arrears", Object.assign({ rateSteps: [{ month: 25, rate: 6.9 }] }, base));
    ok(drop.rows.length < 240, "a rate cut shortens the tenure");
    ok(Math.abs(drop.rows[23].interest - (drop.rows[23].balance + drop.rows[23].principal) * 0.086 / 12) < 1, "old rate applies before the step");
    ok(Math.abs(drop.rows[24].interest - (drop.rows[24].balance + drop.rows[24].principal) * 0.069 / 12) < 1, "new rate applies from the step");

    // "lower the EMI" mode: without prepayments it must re-derive the very same level EMI
    const noop = simulate(2.5e6, 9, 240, E9, "arrears", Object.assign({ prepayMode: "emi" }, base));
    ok(noop.rows.length === 240, "reduce-EMI mode is a no-op on a plain loan");
    ok(Math.abs(noop.emiLast - E9) < 1, "reduce-EMI mode keeps the same EMI when nothing changes");

    // with a lump sum it holds the end date and drops the instalment instead
    const keep = simulate(2.5e6, 9, 240, E9, "arrears",
      Object.assign({ prepayMode: "emi", lumps: [{ month: 13, amount: 5e5 }] }, base));
    ok(keep.rows.length === 240, "reduce-EMI mode keeps the original end date");
    ok(keep.emiLast < E9 - 1000, "reduce-EMI mode lowers the instalment after a lump sum");
    // ...and it must save less interest than finishing early with the same lump sum
    const cut = lump.rows.reduce((a, x) => a + x.interest, 0);
    ok(keep.rows.reduce((a, x) => a + x.interest, 0) > cut, "finishing early beats a lower EMI on interest");

    // tax relief: a 30% payer on a self-occupied home caps at 2L interest + 1.5L principal a year
    const tr = taxRelief(plain.rows, 30, "self", 2.5e6, "old");
    ok(tr.saved > 0 && tr.saved < 3.5e5 * 0.3 * 21, "tax relief stays inside the yearly caps");
    ok(Math.abs(tr.perMonthI.reduce((a, x) => a + x, 0) - tr.savedInterest) < 1, "monthly relief sums to the Sec 24 total");
    ok(tr.savedInterest < tr.saved, "the rate uses only the interest half of the relief");
    ok(taxRelief(plain.rows, 0, "self", 2.5e6, "old") === null, "no slab means no relief");
    // a let-out property has no Sec 24 cap, so it can never save less
    ok(taxRelief(plain.rows, 30, "letout", 2.5e6, "old").saved >= tr.saved, "let-out relief is uncapped");

    // prepay-vs-invest: at a 0% return, prepaying must win (it saves real interest)
    const slowRows = simulate(1207044, 14, 180, E14, "arrears", base).rows;
    const ic0 = investCompare(fast.rows, slowRows, 180, E14, 5000, [], 0);
    ok(ic0.prepay > ic0.invest, "at 0% return, prepaying wins");
    // at a high enough return the ranking has to flip
    const ic20 = investCompare(fast.rows, slowRows, 180, E14, 5000, [], 0.20 / 12);
    ok(ic20.invest / ic20.prepay > ic0.invest / ic0.prepay, "a higher return favours investing");

    /* Totals must equal the cash that actually leaves your pocket. Under a full moratorium the
       deferred interest is capitalised, so summing the schedule's principal double-counts it —
       the sum repaid exceeds the sum borrowed by exactly the capitalised amount. */
    const capd = simulate(2.5e6, 9, 240, E9, "arrears",
      Object.assign({ moraMonths: 12, moraType: "full" }, base));
    const capdInterest = capd.rows.reduce((a, x) => a + x.interest, 0);
    const capdAmortised = capd.rows.reduce((a, x) => a + x.principal + x.extra, 0);
    const capdCash = capd.rows.reduce((a, x) => a + x.emi + x.extra, 0);
    ok(capdAmortised > 2.5e6 + 1, "capitalised interest inflates what the schedule amortises");
    ok(Math.abs((2.5e6 + capdInterest) - capdCash) < 5, "principal + interest equals the cash paid");
    ok(Math.abs((capdAmortised + capdInterest) - capdCash - (capdAmortised - 2.5e6)) < 5,
      "summing schedule principal would overstate by the capitalised amount");
    // and the plain case is unaffected: nothing is capitalised, so the two agree
    const plainAmortised = plain.rows.reduce((a, x) => a + x.principal + x.extra, 0);
    ok(Math.abs(plainAmortised - 2.5e6) < 1, "with no moratorium, amortised equals the amount borrowed");

    // ---- PR #6 review fixes ----
    // a lump sum dated inside a moratorium must still be applied, not silently dropped
    const lumpInHoliday = simulate(2.5e6, 9, 240, E9, "arrears",
      Object.assign({ moraMonths: 12, moraType: "full", lumps: [{ month: 6, amount: 3e5 }] }, base));
    ok(lumpInHoliday.rows[5].extra === 3e5, "a lump sum inside the holiday lands on its month");
    ok(lumpInHoliday.rows[5].balance < lumpInHoliday.rows[4].balance, "and it reduces the balance");

    // advance scheme must not charge interest on money prepaid at the start of the month
    const advNoExtra = simulate(2.5e6, 9, 240, emiFor(2.5e6, r9, 240, "advance"), "advance", base);
    const advExtra = simulate(2.5e6, 9, 240, emiFor(2.5e6, r9, 240, "advance"), "advance",
      Object.assign({ extraMonthly: 5000 }, base));
    ok(advExtra.rows[0].interest < advNoExtra.rows[0].interest, "advance prepayment cuts that month's interest");

    // a 0% flat loan is a valid answer, not an error
    ok(!solve({ mode: "rate", rateType: "flat", amount: 1e6, emi: 1e6 / 60, tenure: 60, scheme: "arrears",
      startY: 2026, startM: 0, fees: 0, moraMonths: 0, lumps: [], rateSteps: [] }).error,
      "an interest-free flat loan is accepted");

    // solving for a rate must not round itself into an extra payment
    const exactE = emiFor(2.5e6, 0.09005 / 12, 240, "arrears");
    const rSolved = solve({ mode: "rate", rateType: "reducing", amount: 2.5e6, emi: exactE, tenure: 240,
      scheme: "arrears", startY: 2026, startM: 0, fees: 0, moraMonths: 0, moraType: "interest",
      extraMonthly: 0, lumps: [], rateSteps: [], prepayMode: "tenure" });
    ok(!rSolved.error && rSolved.rows.length === 240, "a solved rate still repays in exactly its tenure");

    // Loan Amount mode must honour a full moratorium: the EMI you asked for is the EMI you get
    const amt = solve({ mode: "amount", rateType: "reducing", amount: 0, emi: 22493, tenure: 240,
      scheme: "arrears", startY: 2026, startM: 0, fees: 0, moraMonths: 12, moraType: "full",
      extraMonthly: 0, lumps: [], rateSteps: [], prepayMode: "tenure", rate: 9 });
    ok(!amt.error && Math.abs(amt.E - 22493) < 25, "loan amount solves back to the requested EMI");

    // ---- PR #7 review fixes ----
    const stBase = { mode: "emi", currency: "INR", rateType: "reducing", scheme: "arrears",
      startY: 2026, startM: 0, fees: 0, moraMonths: 0, moraType: "interest", extraMonthly: 0,
      lumps: [], rateSteps: [], prepayMode: "tenure", amount: 2.5e6, rate: 9, tenure: 240, emi: 0 };

    // the invest path keeps contributing to the original end date, not to the early payoff
    // with the budget model, path B invests its extra every month to the original end date
    const rowsB180 = new Array(180).fill(0).map(() => ({ emi: 20000, extra: 0 }));
    const rowsA96 = new Array(96).fill(0).map(() => ({ emi: 20000, extra: 5000 }));
    const icShort = investCompare(rowsA96, rowsB180, 180, 20000, 5000, [], 0.10 / 12);
    let manualB = 0;
    for (let i = 0; i < 180; i++) manualB += 5000 * Math.pow(1 + 0.10 / 12, 179 - i);
    ok(Math.abs(icShort.invest - manualB) < 1, "invest path runs to the original end date");
    ok(icShort.invest > 5000 * 96, "and is not truncated at the early payoff");

    // bench totals must not double-count capitalised interest, same as present()
    const benchMora = computeBench(Object.assign({}, stBase, { moraMonths: 12, moraType: "full" }));
    ok(Math.abs(benchMora.total - (2.5e6 + benchMora.interest)) < 2, "bench total excludes capitalised double-count");

    // a fee-free flat loan's APR is its true reducing cost, not the quoted flat number
    const benchFlat = computeBench(Object.assign({}, stBase, { rateType: "flat", rate: 8, tenure: 60 }));
    ok(benchFlat.apr > 14, "flat APR reflects the real cost, not the headline rate");

    // solving a flat rate must clear the balance exactly, not leave a residue
    const flatSolved = solve(Object.assign({}, stBase, { mode: "rate", rateType: "flat",
      amount: 1e6, tenure: 60, emi: 23333 }));
    ok(!flatSolved.error && flatSolved.rows.length === 60, "flat rate solve keeps its tenure");
    ok(flatSolved.rows[flatSolved.rows.length - 1].balance < 0.5, "and closes to zero");

    // loan amount honours a lump sum paid during the holiday
    const amtLump = solve(Object.assign({}, stBase, { mode: "amount", emi: 22493, moraMonths: 12,
      moraType: "full", lumps: [{ month: 6, amount: 3e5 }] }));
    ok(!amtLump.error && Math.abs(amtLump.E - 22493) < 25, "holiday lump sums feed the amount inversion");

    // 80C must not also claim interest that was capitalised and already relieved under Sec 24
    const moraRows = simulate(2.5e6, 9, 240, E9, "arrears",
      Object.assign({ moraMonths: 12, moraType: "full" }, base)).rows;
    const trMora = taxRelief(moraRows, 30, "self", 2.5e6, "old");
    const trNaive = taxRelief(moraRows, 30, "self", 0, "old");   // 0 disables the scaling
    ok(trMora.saved < trNaive.saved, "capitalised interest is not claimed twice");

    // a renamed scenario cannot inject markup
    ok(esc('Bank "A" <b>') === "Bank &quot;A&quot; &lt;b&gt;", "scenario names are escaped");

    // ---- PR #7 second review ----
    // a lump scheduled after the early payoff must be invested by the prepay path too
    const lateLump = [{ month: 120, amount: 4e5 }];
    const icLate = investCompare(rowsA96, rowsB180, 180, 20000, 0, lateLump, 0.10 / 12);
    const icNoLate = investCompare(rowsA96, rowsB180, 180, 20000, 0, [], 0.10 / 12);
    ok(icLate.prepay > icNoLate.prepay, "post-payoff lumps are invested on the prepay path");
    // month 120 is index 119, so it compounds for (nBase - 1 - 119) = 60 periods
    ok(Math.abs(icLate.prepay - icNoLate.prepay - 4e5 * Math.pow(1 + 0.10 / 12, 60)) < 1,
      "and are compounded from their own month");

    // an exact 0% cash flow is a 0% APR, not "no rate fits"
    ok(irrMonthly(1e6, new Array(60).fill(1e6 / 60), "arrears") === 0, "a 0% loan has a 0% APR");
    ok(isNaN(irrMonthly(1e6, new Array(60).fill(1e5 / 60), "arrears")), "a real shortfall still has none");

    // a partial tie must not crown the first of two equally good offers
    ok(bestIndex([0, 0, 25000], true) === -1, "a shared best value awards nobody");
    ok(bestIndex([0, 12000, 25000], true) === 0, "a unique best value still wins");

    // the final instalment, not the anniversary
    ok(endLabel(2026, 0, 239) === "Dec 2045", "240 payments from Jan 2026 end in Dec 2045");

    // the investment baseline keeps the holiday and rate steps, dropping only prepayments
    const npBase = solve(Object.assign({}, stBase, { moraMonths: 12, moraType: "full",
      extraMonthly: 5000, emi: 0 }));
    const holidayOnly = solve(Object.assign({}, stBase, { moraMonths: 12, moraType: "full", emi: 0 }));
    ok(npBase.noPrepayMonths === holidayOnly.rows.length,
      "prepay-vs-invest baseline retains the moratorium");

    // loading a saved chip must not alias its arrays
    const savedChip = { lumps: [{ month: 6, amount: 1e5 }], rateSteps: [] };
    const restored = restore(savedChip);
    restored.lumps[0].amount = 9e9;
    ok(savedChip.lumps[0].amount === 1e5, "restoring a chip clones its event arrays");

    // ---- PR #7 third review ----
    /* A part-payment in the payoff month leaves budget unspent, and that surplus belongs to the
       prepayer. Path A here pays only 1,000 in its final month against a 20,000 budget. */
    const rowsAshort = new Array(96).fill(0).map((_, i) =>
      i === 95 ? { emi: 1000, extra: 0 } : { emi: 20000, extra: 0 });
    const icSurplus = investCompare(rowsAshort, rowsB180, 180, 20000, 0, [], 0);
    ok(Math.abs(icSurplus.prepay - (19000 + 20000 * 84)) < 1, "payoff-month surplus is invested");

    /* A moratorium never applies extraMonthly, so both paths leave it unspent in those months and
       must be credited identically — previously only the investing path got it. */
    const moraA = [{ emi: 0, extra: 0 }, { emi: 0, extra: 0 }].concat(
      new Array(10).fill(0).map(() => ({ emi: 20000, extra: 5000 })));
    const moraB = [{ emi: 0, extra: 0 }, { emi: 0, extra: 0 }].concat(
      new Array(10).fill(0).map(() => ({ emi: 20000, extra: 0 })));
    const icMora = investCompare(moraA, moraB, 12, 20000, 5000, [], 0);
    ok(Math.abs(icMora.prepay - icMora.invest - (-5000 * 10)) < 1,
      "holiday months credit both paths the same");

    // pre-construction interest is deferred, then relieved over five years from completion
    const preConRows = simulate(2.5e6, 9, 240, E9, "arrears",
      Object.assign({ moraMonths: 24, moraType: "interest" }, base)).rows;
    const trPre = taxRelief(preConRows, 30, "self", 2.5e6, "old");
    const moraInterest = preConRows.filter((x) => x.mora).reduce((a, x) => a + x.interest, 0);
    ok(moraInterest > 0, "the holiday accrues interest to defer");
    // Aug 2026 - Mar 2027 is wholly pre-construction, so that FY must claim nothing at all
    ok(trPre.perMonthI.slice(0, 8).every((v) => v === 0),
      "no relief is claimed in a wholly pre-construction year");
    // deferring it past the 2L cap changes the total, so it must differ from claiming as accrued
    const trPreNoDefer = taxRelief(preConRows.map((x) => Object.assign({}, x, { mora: false })),
      30, "self", 2.5e6, "old");
    ok(Math.abs(trPre.saved - trPreNoDefer.saved) > 1, "deferral changes the relief, as the caps imply");

    // new regime: nothing for a self-occupied home, but Sec 24 survives on a let-out one
    ok(taxRelief(plain.rows, 30, "self", 2.5e6, "new") === null, "new regime gives a self-occupied home nothing");
    const trNewLet = taxRelief(plain.rows, 30, "letout", 2.5e6, "new");
    ok(trNewLet && trNewLet.savedInterest > 0, "new regime still relieves let-out interest");
    ok(Math.abs(trNewLet.saved - trNewLet.savedInterest) < 1, "and grants no 80C on top of it");

    // the bench must agree with the main panel exactly — it runs the same solve()
    const snapA = Object.assign(snapshot(), { amount: 2.5e6, rate: 9, tenure: 240, fees: 0, mode: "emi",
      rateType: "reducing", scheme: "arrears", startY: 2026, startM: 0, moraMonths: 0, extraMonthly: 0,
      lumps: [], rateSteps: [], prepayMode: "tenure" });
    const evA = benchEval(snapA);
    ok(Math.abs(evA.emi - E9) < 1, "bench EMI matches the calculator");
    ok(evA.months === 240 && Math.abs(evA.total - (2.5e6 + evA.interest)) < 1, "bench totals add up");
    // a cheaper rate must win on total outgo, and fees must show up in the APR
    const snapB = Object.assign({}, snapA, { rate: 8.4, fees: 25000 });
    const evB = benchEval(snapB);
    ok(evB.total < evA.total, "the cheaper rate wins on total outgo");
    ok(evB.apr > 8.4, "fees push the APR above the headline rate");
    ok(bestIndex([evA.total, evB.total], true) === 1, "bestIndex picks the cheaper scenario");
    ok(bestIndex([100, 100, 100], true) === -1, "bestIndex refuses to crown a tie");
    ok(bestIndex([evA.months, evB.months], true) === -1, "equal tenures are not a win");
    // a fraction of a percentage point is a real difference, not float noise
    ok(bestIndex([9, 8.54, 8.68], true) === 1, "small rate gaps still pick a winner");

    // flat-rate loan: total repayment is P + P·f·years, and it is far dearer than the same reducing rate
    const fe = flatEmi(1e6, 8, 60);
    ok(Math.abs(fe * 60 - (1e6 + 1e6 * 0.08 * 5)) < 1, "flat total repayment");
    const fs = flatSchedule(1e6, 8, 60, fe, 2026, 0);
    ok(fs.length === 60 && fs[59].balance < 1e-6, "flat schedule closes to zero");
    ok(fs.every((x) => Math.abs(x.emi - fe) < 0.01), "a level flat schedule pays the same every month");
    // solving for tenure keeps the EMI the user typed, with a smaller final instalment
    const fsT = flatSchedule(1e6, 8, 55, 20000, 2026, 0);
    ok(fsT.slice(0, -1).every((x) => Math.abs(x.emi - 20000) < 0.01), "entered flat EMI is preserved");
    ok(fsT[fsT.length - 1].emi <= 20000 + 0.01, "the last flat instalment is a part payment");
    ok(irrMonthly(1e6, fs.map((x) => x.emi), "arrears") * 1200 > 14, "flat 8% is over 14% reducing");

    // IRR agrees with the nominal rate when there are no fees, whatever reshapes the payments
    const flowsOf = (s) => s.rows.map((x) => x.emi + x.extra);
    ok(Math.abs(irrMonthly(2.5e6, flowsOf(plain), "arrears") * 1200 - 9) < 0.01, "IRR of a plain loan is the nominal rate");
    ok(Math.abs(irrMonthly(2.5e6, flowsOf(lump), "arrears") * 1200 - 9) < 0.01, "prepayment doesn't change the IRR");
    ok(Math.abs(irrMonthly(2.5e6, flowsOf(mora), "arrears") * 1200 - 9) < 0.01, "a Pre-EMI holiday doesn't change the IRR");
    // fees are money you never receive, so they push the APR above the headline rate
    ok(irrMonthly(2.5e6 - 5e4, flowsOf(plain), "arrears") * 1200 > 9.1, "fees lift the APR above the nominal rate");
    ok(isNaN(irrMonthly(2.5e6, [100, 100], "arrears")), "no rate fits payments that never repay the principal");

    // negative amortisation is caught rather than looped on
    ok(simulate(1e6, 12, 240, 100, "arrears", base).negAm, "negative amortisation detected");
  })();
})();
</script>
