<head>

<title>Life Calendar</title>

<style>
:root {
    --bg: #0a0a14;
    --surface: #16162a;
    --accent: #ff6b35;
    --accent-light: #ff8c42;
    --accent-dark: #d94f1a;
    --accent-glow: rgba(255, 107, 53, 0.15);
    --accent-subtle: rgba(255, 107, 53, 0.06);
    --text: #f0ece4;
    --text-dim: #8a8a9a;
    --text-muted: #5a5a6e;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: "SF Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
    --box-size: 10px;
    --box-gap: 2px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 2rem;
}
.container {
    background: var(--surface); border-radius: var(--radius-lg);
    padding: 2rem; width: 100%; max-width: 700px; text-align: center;
}
h1 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.35em;
    font-weight: 200; opacity: 0.5; margin-bottom: 0.25rem;
}
.tagline { color: var(--text-muted); font-size: 0.7rem; margin-bottom: 1.5rem; }
.input-section {
    display: flex; align-items: center; justify-content: center;
    gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;
}
.input-section label { color: var(--text-dim); font-size: 0.85rem; }
.input-section input[type="number"] {
    background: var(--bg); border: 1px solid var(--text-muted); color: var(--text);
    padding: 0.5rem 0.75rem; border-radius: var(--radius-sm);
    font-family: var(--font); font-size: 1rem; width: 80px; text-align: center;
}
.input-section input[type="number"]:focus { outline: none; border-color: var(--accent); }
.input-section input[type="range"] {
    accent-color: var(--accent); width: 200px;
}
.input-section input[type="date"] {
    background: var(--bg); border: 1px solid var(--text-muted); color: var(--text);
    padding: 0.5rem 0.75rem; border-radius: var(--radius-sm);
    font-family: var(--font); font-size: 0.85rem; cursor: pointer;
}
.input-section input[type="date"]:focus { outline: none; border-color: var(--accent); }
.stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem;
    margin-bottom: 1.5rem;
}
.stat {
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 0.75rem 0.5rem; text-align: center;
}
.stat .value {
    font-family: var(--mono); font-size: 1.2rem; font-weight: 700; color: var(--accent-light);
}
.stat .label { font-size: 0.65rem; color: var(--text-dim); margin-top: 0.2rem; }
.life-pct {
    font-size: 0.9rem; color: var(--accent); margin-bottom: 1.5rem;
    font-family: var(--mono);
}
.calendar-wrapper {
    overflow-x: auto; padding-bottom: 0.5rem;
}
.calendar {
    display: inline-grid; grid-template-columns: repeat(52, var(--box-size));
    gap: var(--box-gap); margin: 0 auto;
}
.box {
    width: var(--box-size); height: var(--box-size);
    border-radius: 2px; background: var(--bg);
    cursor: pointer; transition: all 0.15s;
    position: relative;
}
.box.lived { background: #2a2a2a; } /* past weeks — grey */
.box.current { background: var(--accent); } /* current week — orange accent */
.box.future { background: var(--bg); } /* future weeks — dark */
.box:hover {
    transform: scale(1.8); z-index: 10;
    box-shadow: 0 0 12px var(--accent-glow);
}
.box:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; font-size: 0.6rem;
    padding: 2px 6px; border-radius: 4px; white-space: nowrap;
    z-index: 20;
}
.year-label {
    display: flex; gap: var(--box-gap); margin-top: 1px;
}
.year-label span {
    width: var(--box-size); height: 4px;
    font-size: 0.5rem; color: var(--text-muted); line-height: 4px;
    text-align: center; overflow: hidden;
}
footer { margin-top: 2rem; font-size: 0.7rem; color: var(--text-muted); }
footer a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
footer a:hover { color: var(--accent); }
</style>
<link id="site-canonical" rel="canonical" href="https://tools.soumendrak.com/t/lifecalendar">
<style id="site-theme-override">
:root[data-theme="dark"]{--bg:#231c17;--surface:#2d251f;--bg-card:#2d251f;--bg-toggle:#38302a;--card-bg:#2d251f;--card:#2d251f;--card2:#38302a;--border:#3a3129;--text:#f2ebe0;--fg:#f2ebe0;--text-dim:#b0a496;--text-muted:#8a7d6f;--muted:#b0a496;--accent:#d17d5c;--accent-light:#e19b7f;--accent-dark:#b4522e;--accent-dim:#b4522e;--accent-hover:#e19b7f;--accent-glow:rgba(209,125,92,.25);--accent-subtle:rgba(209,125,92,.12);--orange:#d17d5c;--orange-glow:rgba(209,125,92,.4);--orange-dim:rgba(209,125,92,.14);color-scheme:dark;}
:root[data-theme="light"]{--bg:#f7f0e6;--surface:#fdf8f0;--bg-card:#ffffff;--bg-toggle:#efe6d8;--card-bg:#ffffff;--card:#ffffff;--card2:#efe6d8;--border:#e6dccc;--text:#2a201a;--fg:#2a201a;--text-dim:#6f6255;--text-muted:#948676;--muted:#6f6255;--accent:#b4522e;--accent-light:#c96a44;--accent-dark:#9c4527;--accent-dim:#b4522e;--accent-hover:#9c4527;--accent-glow:rgba(180,82,46,.18);--accent-subtle:rgba(180,82,46,.08);--orange:#b4522e;--orange-glow:rgba(180,82,46,.28);--orange-dim:rgba(180,82,46,.12);color-scheme:light;}
</style>
<script id="site-theme-sync">(function(){function a(t){document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}var t;try{t=localStorage.getItem('theme');}catch(e){}if(!t){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}a(t);addEventListener('storage',function(e){if(e.key==='theme'&&e.newValue)a(e.newValue);});addEventListener('message',function(e){if(e.data&&e.data.__theme)a(e.data.__theme);});})();</script>
</head>
<body>
<div class="container">
    <h1>Life Calendar</h1>
    <p class="tagline">Your life in weeks — 90 years at a glance</p>
    <div class="input-section">
        <label for="dobInput">Date of Birth:</label>
        <input type="date" id="dobInput">
        <span style="color:var(--text-muted);font-size:0.75rem;">or</span>
        <label for="ageInput">Age:</label>
        <input type="number" id="ageInput" min="0" max="90" value="25">
        <input type="range" id="ageSlider" min="0" max="90" value="25">
    </div>
    <div class="stats-grid">
        <div class="stat"><div class="value" id="yearsLived">0</div><div class="label">Years Lived</div></div>
        <div class="stat"><div class="value" id="yearsLeft">0</div><div class="label">Years Left</div></div>
        <div class="stat"><div class="value" id="weeksLived">0</div><div class="label">Weeks Lived</div></div>
        <div class="stat"><div class="value" id="weeksLeft">0</div><div class="label">Weeks Left</div></div>
    </div>
    <div class="life-pct" id="lifePct">You have used 0% of your life</div>
    <div class="calendar-wrapper">
        <div class="calendar" id="calendar"></div>
    </div>
</div>
<script>
const TOTAL_YEARS = 90;
const WEEKS_PER_YEAR = 52;

const $dobInput = document.getElementById('dobInput');
const $ageInput = document.getElementById('ageInput');
const $ageSlider = document.getElementById('ageSlider');
const $yearsLived = document.getElementById('yearsLived');
const $yearsLeft = document.getElementById('yearsLeft');
const $weeksLived = document.getElementById('weeksLived');
const $weeksLeft = document.getElementById('weeksLeft');
const $lifePct = document.getElementById('lifePct');
const $calendar = document.getElementById('calendar');

function getAgeFromDOB(dobStr) {
    if (!dobStr) return null;
    const birth = new Date(dobStr + 'T00:00:00');
    if (isNaN(birth.getTime())) return null;
    const now = new Date();
    let age = now.getFullYear() - birth.getFullYear();
    const mDiff = now.getMonth() - birth.getMonth();
    if (mDiff < 0 || (mDiff === 0 && now.getDate() < birth.getDate())) {
        age--;
    }
    return Math.max(0, Math.min(TOTAL_YEARS, age));
}

function getCurrentWeekOfYear() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 1);
    const diff = now - start;
    const dayOfYear = Math.floor(diff / 86400000);
    return Math.floor(dayOfYear / 7);
}

function render(age) {
    age = Math.min(TOTAL_YEARS, Math.max(0, Math.round(age)));
    const weeksLived = age * WEEKS_PER_YEAR;
    const totalWeeks = TOTAL_YEARS * WEEKS_PER_YEAR;
    const weeksRemaining = totalWeeks - weeksLived;
    const pct = totalWeeks > 0 ? (weeksLived / totalWeeks) * 100 : 0;

    $yearsLived.textContent = age;
    $yearsLeft.textContent = TOTAL_YEARS - age;
    $weeksLived.textContent = weeksLived.toLocaleString();
    $weeksLeft.textContent = weeksRemaining.toLocaleString();
    $lifePct.textContent = 'You have used ' + pct.toFixed(1) + '% of your life';

    // Calculate current week (global week index within 90 years)
    const currentGlobalWeek = age > 0 ? (weeksLived - WEEKS_PER_YEAR + getCurrentWeekOfYear()) : 0;

    let html = '';
    let boxIdx = 0;
    for (let y = 0; y < TOTAL_YEARS; y++) {
        for (let w = 0; w < WEEKS_PER_YEAR; w++) {
            let cssClass = 'future';
            if (boxIdx < weeksLived) {
                // This week is fully lived (past)
                cssClass = 'lived';
            }
            if (boxIdx === weeksLived || (boxIdx < weeksLived && boxIdx === weeksLived - 1 && age > 0 && w === getCurrentWeekOfYear())) {
                // Current week
                cssClass = 'current';
            }
            // If it's the exact current week
            if (age > 0 && y === age - 1 && w === getCurrentWeekOfYear()) {
                cssClass = 'current';
            }
            const tip = 'Year ' + (y + 1) + ', Week ' + (w + 1);
            html += '<div class="box ' + cssClass + '" data-tip="' + tip + '" data-idx="' + boxIdx + '"></div>';
            boxIdx++;
        }
    }
    $calendar.innerHTML = html;
}

function syncAge(value) {
    const v = parseInt(value) || 0;
    $ageInput.value = v;
    $ageSlider.value = v;
    render(v);
    localStorage.setItem('lc_age', v);
}

function syncFromDOB() {
    const dob = $dobInput.value;
    if (!dob) return;
    const age = getAgeFromDOB(dob);
    if (age !== null) {
        syncAge(age);
        localStorage.setItem('lc_dob', dob);
    }
}

$ageInput.addEventListener('input', function() {
    $dobInput.value = '';
    localStorage.removeItem('lc_dob');
    syncAge(this.value);
});
$ageSlider.addEventListener('input', function() {
    $dobInput.value = '';
    localStorage.removeItem('lc_dob');
    syncAge(this.value);
});
$dobInput.addEventListener('change', syncFromDOB);

// Restore saved state
const savedDob = localStorage.getItem('lc_dob');
const savedAge = localStorage.getItem('lc_age');
if (savedDob) {
    $dobInput.value = savedDob;
    syncFromDOB();
} else if (savedAge !== null) {
    syncAge(parseInt(savedAge));
} else {
    syncAge(25);
}
</script>
</body>
</html>
